name: Mezclar voz y publicar
on:
  push:
    paths: ['jobs/*.json']
permissions:
  contents: write
jobs:
  mezclar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - name: Procesar trabajos nuevos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for job in $(git diff --name-only HEAD~1 HEAD -- 'jobs/*.json'); do
            [ -f "$job" ] || continue
            id=$(jq -r .id "$job"); video=$(jq -r .video "$job"); voz=$(jq -r .voice_url "$job")
            echo "Trabajo $id"
            curl -sSL --fail -o voz.mp3 "$voz"
            # La música baja automáticamente cuando habla la voz (sidechain) y se normaliza el volumen
            ffmpeg -y -v error -i "$video" -i voz.mp3 -filter_complex \
              "[1:a]aresample=44100,asplit=2[v1][v2];[0:a]aresample=44100[bed];[bed][v1]sidechaincompress=threshold=0.03:ratio=8:attack=20:release=300[duck];[duck][v2]amix=inputs=2:duration=first:normalize=0,loudnorm=I=-15:TP=-1.5:LRA=11[a]" \
              -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -ar 44100 -movflags +faststart final.mp4
            ffprobe -v error -show_entries format=duration -of default=nw=1 final.mp4
            gh release create "$id" final.mp4 --title "$id" --notes "Video final con voz" || gh release upload "$id" final.mp4 --clobber
            rm -f voz.mp3 final.mp4
          done
