name: Mezclar voz y publicar
on:
  push:
    paths: ['jobs/*.json']
permissions:
  contents: write
jobs:
  mezclar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - name: Procesar trabajos nuevos
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          set -e
          for job in $(git diff --name-only HEAD~1 HEAD -- 'jobs/*.json'); do
            [ -f "$job" ] || continue
            id=$(jq -r .id "$job"); video=$(jq -r .video "$job"); voz=$(jq -r .voice_url "$job")
            echo "Trabajo $id"
            curl -sSL --fail -o voz_orig "$voz"
            # Cortes de repeticiones y procesado de voz (opcional: "segmentos", "procesar_voz")
            if jq -e '.segmentos or .procesar_voz' "$job" >/dev/null; then
              python3 scripts/preparar_voz.py "$job" voz_orig voz.wav && ffmpeg -y -v error -i voz.wav -b:a 192k voz.mp3 && rm -f voz.wav
            else
              mv voz_orig voz.mp3
            fi
            rm -f voz_orig
                 tempo=$(jq -r '.tempo // 1' "$job"); delay=$(jq -r '.delay_ms // 0' "$job")
                 if [ "$tempo" != "1" ] || [ "$delay" != "0" ]; then
                   ffmpeg -y -v error -i voz.mp3 -af "atempo=$tempo,adelay=${delay}|${delay}" -ar 44100 voz2.mp3 && mv voz2.mp3 voz.mp3
                 fi
            # La música baja automáticamente cuando habla la voz (sidechain) y se normaliza el volumen
            ffmpeg -y -v error -i "$video" -i voz.mp3 -filter_complex \
              "[1:a]aresample=44100,apad=pad_dur=6,asplit=2[v1][v2];[0:a]aresample=44100[bed];[bed][v1]sidechaincompress=threshold=0.03:ratio=8:attack=20:release=300[duck];[duck][v2]amix=inputs=2:duration=first:normalize=0,loudnorm=I=-15:TP=-1.5:LRA=11[a]" \
              -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -ar 44100 -movflags +faststart final.mp4
            mkdir -p reportes
            { echo "id=$id"; echo -n "voz_seg="; ffprobe -v error -show_entries format=duration -of csv=p=0 voz.mp3; echo -n "final_seg="; ffprobe -v error -show_entries format=duration -of csv=p=0 final.mp4; ffmpeg -i final.mp4 -af volumedetect -vn -f null - 2>&1 | grep -E "mean_volume|max_volume"; } > "reportes/$id.txt"
            ffmpeg -y -v error -i final.mp4 -vn -ac 2 -b:a 160k "reportes/$id-audio.mp3"
            gh release create "$id" final.mp4 --title "$id" --notes "Video final con voz" || gh release upload "$id" final.mp4 --clobber
            rm -f voz.mp3 final.mp4
            # Subida automática a YouTube vía Make (solo si hay youtube/<id>.json y el secreto)
            scripts/enviar_make.sh "$id" | tee -a "reportes/$id.txt"
          done
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add reportes && git commit -m "Reporte de mezcla [skip ci]" && git push || true
