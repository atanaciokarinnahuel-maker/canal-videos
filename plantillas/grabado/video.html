<!doctype html><html><head><meta charset="utf-8">
<!-- Plantilla "grabado": ilustraciones de grabado (generadas aparte) animadas con cámara, luz, polvo, niebla,
     transición de tinta, temblor y subtítulos por personaje. 1920x1080. Lee escenas.json y words.json. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#1d140b}
canvas{position:absolute;left:0;top:0}
#subs{position:absolute;left:180px;right:180px;top:880px;height:140px;text-align:center;font-family:'Inter Display','Inter';font-weight:900;font-size:60px;line-height:1.1;text-transform:uppercase;letter-spacing:-1px}
#subs span{display:inline-block;margin:0 11px;color:#fff8e8;-webkit-text-stroke:13px #1d1209;paint-order:stroke fill;transform-origin:50% 70%}
#subs span.on{color:#7fe9da}
#subs.dios span{color:#ffe2a0}#subs.dios span.on{color:#ffc24d}
#subs.jesus span{color:#fff3e6}#subs.jesus span.on{color:#ff9f8a}
#ref{position:absolute;left:60px;top:54px;display:none;padding:10px 30px 12px;background:#f3e4c0;border:4px solid #3a2817;box-shadow:0 0 0 3px #f3e4c0,0 0 0 6px #3a2817,0 10px 0 rgba(0,0,0,.3);font-family:'Bitstream Charter','Caladea','DejaVu Serif',serif;font-weight:700;font-size:36px;color:#3a2817;transform-origin:0 50%}
#ref i{font-style:normal;font-size:22px;color:#8c2f1c;letter-spacing:3px;margin-left:14px}
#cap{position:absolute;left:0;right:0;top:330px;padding:70px 0 80px;text-align:center;display:none;background:radial-gradient(ellipse 34% 50% at 50% 50%,rgba(20,10,2,.62),rgba(20,10,2,0));font-family:'Bitstream Charter','Caladea','DejaVu Serif',serif;color:#f6e9c8;text-shadow:0 4px 24px rgba(0,0,0,.85)}
#cap .a{font-size:36px;letter-spacing:12px;color:#f0cf86;font-weight:700}#cap .b{font-size:96px;font-weight:700;margin-top:8px}
#cap hr{width:360px;margin:20px auto 0;border:0;border-top:3px solid #c9a253}
#sello{position:absolute;left:1440px;top:150px;display:none;transform-origin:50% 50%}
#sello div{padding:14px 40px;border:10px solid #9c2a17;border-radius:12px;font-family:'Bitstream Charter','Caladea','DejaVu Serif',serif;font-weight:700;font-size:64px;letter-spacing:5px;color:#9c2a17;background:rgba(246,233,200,.82);box-shadow:inset 0 0 0 4px rgba(156,42,23,.5)}
</style></head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<div id="cap"><div class="a" id="capA"></div><div class="b" id="capB"></div><hr></div>
<div id="ref"></div><div id="sello"><div id="selloIn">CUMPLIDA</div></div>
<div id="subs"></div>
<script>
const $=id=>document.getElementById(id),W=1920,H=1080;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function R(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ]/g,'');
const cv=$('cv'),CX=cv.getContext('2d');
const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const TX=tmp.getContext('2d');
let Wd=[],VOICE=0,DUR=0,G=null,SC=[],GROUPS=[],REFS=[],CAPS=[],SHAKES=[],SEAL=null,IMG={},NOISE=null,NPX=null,NMN=0,NMX=255,MASK=null,MCX=null,GRAIN=[];
function A(word,occ=1){const k=norm(word);let c=0;for(const w of Wd){if(norm(w.text)===k){c++;if(c==occ)return w}}console.error('ANCLA? '+word+' '+occ);return {start:0,end:0}}
/* ancla: número (segundos), ["palabra", aparición, desfase] o ["frase de varias palabras", aparición, desfase] */
function at(a){if(typeof a==='number')return a;if(a[0].includes(' ')){const ks=a[0].split(' ').map(norm);let c=0;for(let i=0;i+ks.length<=Wd.length;i++){if(ks.every((k,j)=>norm(Wd[i+j].text)===k)){c++;if(c==(a[1]||1))return Wd[i].start+(a[2]||0)}}console.error('ANCLA? '+a[0]);return 0}return A(a[0],a[1]||1).start+(a[2]||0)}
function noiseTex(w,h,seed,blur){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const d=x.createImageData(w,h);for(let i=0;i<w*h;i++){const v=R(seed+i*.731)*255;d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v;d.data[i*4+3]=255}x.putImageData(d,0,0);if(!blur)return c;const c2=document.createElement('canvas');c2.width=w;c2.height=h;const y=c2.getContext('2d');y.filter=`blur(${blur}px)`;y.drawImage(c,-blur*2,-blur*2,w+blur*4,h+blur*4);y.filter='none';return c2}
async function init(d){Wd=d.words;VOICE=d.voice_dur;DUR=d.dur;G=d.guion;
 const srcs=[...new Set(G.escenas.map(e=>e.img))];
 await Promise.all(srcs.map(s=>new Promise((ok,ko)=>{const im=new Image();im.onload=()=>{IMG[s]=im;ok()};im.onerror=()=>ko('no carga '+s);im.src=s})));
 SC=G.escenas.map(e=>({...e,t0:Math.max(0,at(e.en)-.15)}));SC.forEach((s,i)=>{s.t1=i<SC.length-1?SC[i+1].t0:DUR});
 REFS=(G.refs||[]).map(r=>({t0:at(r.desde),t1:at(r.hasta),texto:r.texto}));
 CAPS=(G.capitulos||[]).map(c=>({t0:at(c.en),a:c.a,b:c.b,d:c.dur||3.2}));
 SHAKES=(G.temblores||[]).map(s=>({t:at(s.en),f:s.fuerza||1}));
 SEAL=G.sello?{t:at(G.sello.en),texto:G.sello.texto||'CUMPLIDA'}:null;
 let cur=[];GROUPS=[];Wd.forEach((w,i)=>{if(cur.length&&Wd[cur[0]].v!==w.v){GROUPS.push(cur);cur=[]}cur.push(i);const txt=cur.map(j=>Wd[j].text).join(' ');if(/[.,!?:;…»]$/.test(w.text)||cur.length>=3||txt.length>16){GROUPS.push(cur);cur=[]}});if(cur.length)GROUPS.push(cur);
 NOISE=noiseTex(480,270,3,7);NPX=NOISE.getContext('2d').getImageData(0,0,480,270).data;NMN=255;NMX=0;for(let i=0;i<NPX.length;i+=4){NMN=Math.min(NMN,NPX[i]);NMX=Math.max(NMX,NPX[i])}
 MASK=document.createElement('canvas');MASK.width=480;MASK.height=270;MCX=MASK.getContext('2d');
 for(let k=0;k<4;k++)GRAIN.push(noiseTex(640,360,40+k*17,0));
 return {dur:DUR,voz:VOICE,escenas:SC.map(s=>[s.img,+s.t0.toFixed(2),+(s.t1-s.t0).toFixed(2)]),capitulos:CAPS.map(c=>+c.t0.toFixed(2)),temblores:SHAKES.map(k=>+k.t.toFixed(2)),grupos:GROUPS.length}}
/* encuadre: cam=[x0,y0,z0,x1,y1,z1]: centro en fracciones de la imagen y zoom (1 = la imagen cubre justo el cuadro) */
function drawImg(ctx,s,T){const im=IMG[s.img],L=T-s.t0,D=Math.max(.01,s.t1-s.t0)+.8,u=eio(clamp(L/D));const c=s.cam||[.5,.5,1.04,.5,.5,1.16];
 const x=lerp(c[0],c[3],u),y=lerp(c[1],c[4],u),z=lerp(c[2],c[5],u);let sx=0,sy=0;
 for(const k of SHAKES){const e=T-k.t;if(e>=0&&e<.9){const a=(1-e/.9)*14*k.f;sx+=Math.sin(e*61)*a;sy+=Math.cos(e*47)*a*.7}}
 const base=Math.max(W/im.width,H/im.height),sc=base*Math.max(1.02,z),dw=im.width*sc,dh=im.height*sc;
 let ox=W/2-x*dw,oy=H/2-y*dh;ox=Math.min(0,Math.max(W-dw,ox))+sx;oy=Math.min(0,Math.max(H-dh,oy))+sy;
 ctx.drawImage(im,ox,oy,dw,dh);return L}
function fx(ctx,s,T){const f=s.fx||[],lx=W*((s.luz||[])[0]??.5),ly=H*((s.luz||[])[1]??-.1);
 if(f.includes('oscuro')){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(15,8,2,.55)');g.addColorStop(.6,'rgba(15,8,2,.12)');g.addColorStop(1,'rgba(15,8,2,.35)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 if(f.includes('rayos')){ctx.globalCompositeOperation='screen';const pulse=.14+.06*Math.sin(T*1.3);const g=ctx.createRadialGradient(lx,ly,10,lx,ly,H*1.3);g.addColorStop(0,`rgba(255,240,200,${pulse+.2})`);g.addColorStop(.5,`rgba(255,220,150,${pulse*.5})`);g.addColorStop(1,'rgba(255,220,150,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){const a=Math.PI*.5+(i-4)*.13+Math.sin(T*.3+i)*.03;ctx.fillStyle=`rgba(255,236,190,${.05+.035*Math.sin(T*.8+i*1.7)})`;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+Math.cos(a-.035)*2400,ly+Math.sin(a-.035)*2400);ctx.lineTo(lx+Math.cos(a+.035)*2400,ly+Math.sin(a+.035)*2400);ctx.fill()}ctx.globalCompositeOperation='source-over'}
 if(f.includes('vela')){const k=.82+.1*Math.sin(T*11)+.06*Math.sin(T*23+1);ctx.fillStyle=`rgba(20,10,0,${(1-k)*.9})`;ctx.fillRect(0,0,W,H);const vx=W*((s.luz||[])[0]??.5),vy=H*((s.luz||[])[1]??.45);const g=ctx.createRadialGradient(vx,vy,20,vx,vy,700);g.addColorStop(0,`rgba(255,190,90,${.22*k})`);g.addColorStop(1,'rgba(255,190,90,0)');ctx.globalCompositeOperation='screen';ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
 if(f.includes('niebla')){ctx.globalAlpha=.18;ctx.globalCompositeOperation='screen';const o=(T*24)%(W*1.2);ctx.drawImage(NOISE,-o,H*.42,W*1.2,H*.8);ctx.drawImage(NOISE,W*1.2-o-2,H*.42,W*1.2,H*.8);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}
 const br=f.includes('brasas'),n=br?70:f.includes('polvo')?90:0;
 for(let i=0;i<n;i++){const sp=br?-60-R(i*3)*70:-8-R(i*3)*14,x=((R(i)*W+Math.sin(T*.4+i)*40+T*(br?6:12)*(R(i*7)-.3))%W+W)%W,y=((R(i*5)*H+T*sp)%H+H)%H,r=1+R(i*11)*(br?3:2.4),tw=.35+.65*Math.abs(Math.sin(T*1.7+i));
  ctx.fillStyle=br?`rgba(255,${150+R(i)*70|0},70,${.75*tw})`:`rgba(255,244,214,${.55*tw})`;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}}
function inkMask(p){const d=MCX.createImageData(480,270),th=NMN+(NMX-NMN+44)*p-22;for(let i=0;i<480*270;i++){d.data[i*4+3]=clamp((th-NPX[i*4])/16)*255}MCX.putImageData(d,0,0)}
function render(T){let i=0;for(let k=0;k<SC.length;k++)if(T>=SC[k].t0)i=k;const s=SC[i],tr=s.trans||'tinta',p=clamp((T-s.t0)/(s.tdur||1.2));
 CX.fillStyle='#1d140b';CX.fillRect(0,0,W,H);
 if(i>0&&p<1){const pr=SC[i-1];drawImg(CX,pr,T);fx(CX,pr,T);
  TX.globalCompositeOperation='source-over';TX.clearRect(0,0,W,H);drawImg(TX,s,T);fx(TX,s,T);
  if(tr==='tinta'){inkMask(eio(p));TX.globalCompositeOperation='destination-in';TX.drawImage(MASK,0,0,W,H);TX.globalCompositeOperation='source-over';CX.drawImage(tmp,0,0)}
  else{CX.globalAlpha=eio(p);CX.drawImage(tmp,0,0);CX.globalAlpha=1}}
 else{drawImg(CX,s,T);fx(CX,s,T)}
 /* acabado: viñeta, grano, fundido de entrada y salida */
 const g=CX.createRadialGradient(W/2,H*.46,H*.35,W/2,H*.5,H*1.05);g.addColorStop(0,'rgba(30,16,4,0)');g.addColorStop(1,'rgba(30,16,4,.7)');CX.fillStyle=g;CX.fillRect(0,0,W,H);
 const fr=Math.floor(T*24);CX.globalAlpha=.1;CX.globalCompositeOperation='overlay';CX.drawImage(GRAIN[fr%GRAIN.length],-R(fr)*200,-R(fr+5)*120,W+200,H+120);CX.globalCompositeOperation='source-over';CX.globalAlpha=1;
 if(T<.8){CX.fillStyle=`rgba(0,0,0,${1-T/.8})`;CX.fillRect(0,0,W,H)}if(T>DUR-1){CX.fillStyle=`rgba(0,0,0,${clamp(T-(DUR-1))})`;CX.fillRect(0,0,W,H)}
 /* textos */
 const c=CAPS.find(c=>T>=c.t0&&T<c.t0+c.d),ce=$('cap');if(c){ce.style.display='block';$('capA').textContent=c.a;$('capB').textContent=c.b;const q=T-c.t0;ce.style.opacity=clamp(q/.5)*clamp((c.d-q)/.5);ce.style.transform=`scale(${lerp(.96,1.02,q/c.d)})`}else ce.style.display='none';
 const r=REFS.find(r=>T>=r.t0&&T<r.t1),re=$('ref');if(r){re.style.display='block';re.innerHTML=r.texto+'<i>RVR1960</i>';re.style.transform=`scale(${back(clamp((T-r.t0)/.3))})`}else re.style.display='none';
 const se=$('sello');if(SEAL&&T>=SEAL.t){se.style.display='block';$('selloIn').textContent=SEAL.texto;const q=clamp((T-SEAL.t)/.28);se.style.transform=`rotate(-10deg) scale(${lerp(2.4,1,eio(q))})`;se.style.opacity=clamp(q*3)}else se.style.display='none';
 let gi=-1;for(let k=0;k<GROUPS.length;k++)if(T>=Wd[GROUPS[k][0]].start-.08)gi=k;const el=$('subs');
 if(gi<0||T>Wd[GROUPS[gi][GROUPS[gi].length-1]].end+.55){el.innerHTML='';return}
 const v=Wd[GROUPS[gi][0]].v||'';el.className=v==='dios'?'dios':v==='jesus'?'jesus':'';
 el.innerHTML=GROUPS[gi].map(j=>{const w=Wd[j],on=T>=w.start-.03&&T<w.end+.06,pop=on?1+.1*Math.sin(clamp((T-w.start)/.16)*Math.PI):1;return `<span class="${on?'on':''}" style="transform:scale(${pop})">${w.text.replace(/[«»]/g,'')}</span>`}).join('')}
</script></body></html>
