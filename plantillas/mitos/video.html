<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#2B1B5A}
body{font-family:'Poppins',sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:#2B1B5A}
#bg{position:absolute;inset:-300px;background:radial-gradient(ellipse at 50% 38%,#4B2A9A 0%,#2B1B5A 62%,#1a0f3d 100%)}
#rays{position:absolute;inset:-600px;}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 3px,transparent 3.5px);background-size:44px 44px}
#cam{position:absolute;inset:0;transform-origin:540px 760px}
.abs{position:absolute}
svg{position:absolute;overflow:visible}
.scene{position:absolute;inset:0;opacity:0}
.mc{position:absolute;left:0;top:0;width:220px;height:100px;transform-origin:110px 50px}

.claim{position:absolute;inset:0;border-radius:44px;background:#fff;border:10px solid #1a0f3d;box-shadow:0 14px 0 #1a0f3d;color:#2B1B5A;padding:26px 40px;overflow:hidden}

.claim .tx{font-weight:900;font-size:68px;line-height:1.02;margin-top:12px;letter-spacing:-1px}
.claim .tx b{color:#FF3D7F}
.shard{position:absolute;left:0;top:0;width:900px;height:270px;opacity:0}
.chip{position:absolute;left:50%;top:300px;transform:translateX(-50%);padding:10px 40px;border-radius:50px;font-weight:900;font-size:44px;letter-spacing:3px;white-space:nowrap;border:6px solid #1a0f3d;box-shadow:0 8px 0 #1a0f3d}
#subs{position:absolute;left:50px;right:50px;top:1390px;height:170px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 8px}
#subs .sw{margin:0 14px;font-weight:900;font-size:78px;color:#fff;display:inline-block;-webkit-text-stroke:12px #1a0f3d;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.4);line-height:1.12;text-transform:uppercase;letter-spacing:-1px}
#subs .sw.on{color:#FFD400}
#wipe{position:absolute;top:-300px;width:1000px;height:2600px;background:#FF3D7F;transform:rotate(14deg);left:-1600px}
#wipe2{position:absolute;top:-300px;width:240px;height:2600px;background:#4FE3FF;transform:rotate(14deg);left:-1600px}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
.row{position:absolute;left:90px;width:900px;height:124px;border-radius:40px;background:#fff;border:8px solid #1a0f3d;box-shadow:0 10px 0 #1a0f3d;color:#2B1B5A}
.row .t{position:absolute;left:170px;top:0;bottom:0;display:flex;align-items:center;font-weight:900;font-size:56px;letter-spacing:-1px}
</style></head><body>

 <div id="bg"></div><div id="rays"></div><div id="dots"></div>
 <div id="cam">
  <div id="scenes"></div>

 </div>

</div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const ei=t=>Math.pow(clamp(t),2.4);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=2.2,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const elastic=t=>{t=clamp(t);if(t===0||t===1)return t;return Math.pow(2,-9*t)*Math.sin((t*9-.75)*2*Math.PI/3)+1};
const $=id=>document.getElementById(id);
const qa=(s,r=document)=>[...r.querySelectorAll(s)];
let W=[],DUR=46,VOICE=44.72;
// tiempos de la voz (transcripción real)
const T1=9.10,T2=18.62,T3=28.68;
const SC=[0,5.0,9.85,14.45,19.2,24.85,29.45,33.65,40.95];
const TRK=[{x:290,y:178},{x:540,y:178},{x:790,y:178}]; // posiciones del marcador superior
const rng=(()=>{let s=7;return()=>{s=(s*16807)%2147483647;return s/2147483647}})();

// ---------- piezas SVG ----------
const INK='#1a0f3d';
function appCard(c,ic){return `<rect width="150" height="190" rx="26" fill="${c}" stroke="${INK}" stroke-width="7"/>${ic}`}
const ICONS=[
 `<circle cx="75" cy="95" r="34" fill="#fff" opacity=".9"/><circle cx="75" cy="95" r="14" fill="${INK}"/>`,
 `<rect x="40" y="62" width="70" height="66" rx="14" fill="#fff" opacity=".9"/><path d="M52 100 l16 -22 l14 18 l10 -12 l12 16z" fill="${INK}" opacity=".7"/>`,
 `<path d="M45 72 h60 a10 10 0 0 1 10 10 v28 a10 10 0 0 1 -10 10 h-34 l-18 16 v-16 h-8 a10 10 0 0 1 -10 -10 v-28 a10 10 0 0 1 10 -10z" fill="#fff" opacity=".9"/>`,
 `<polygon points="55,62 108,95 55,128" fill="#fff" opacity=".92"/>`
];
const COLS=['#FF3D7F','#4FE3FF','#7BE06A','#FFB020'];
function battery(id,w,h){ // batería horizontal
 return `<g id="${id}"><rect x="0" y="0" width="${w}" height="${h}" rx="36" fill="#1a0f3d" opacity=".35" transform="translate(0,10)"/>
 <rect x="0" y="0" width="${w}" height="${h}" rx="36" fill="#fff" stroke="${INK}" stroke-width="10"/>
 <rect x="${w+2}" y="${h*0.3}" width="26" height="${h*0.4}" rx="8" fill="${INK}"/>
 <rect class="lvl" x="16" y="16" width="${w-32}" height="${h-32}" rx="22" fill="#7BE06A"/>
 <text class="pct" x="${w/2}" y="${h*0.66}" text-anchor="middle" font-size="${h*0.5}" font-weight="900" fill="${INK}">100%</text></g>`}
function bolt(x,y,s,c='#FFD400'){return `<path transform="translate(${x},${y}) scale(${s})" d="M10 0 L-18 44 H-2 L-10 80 L24 30 H6 Z" fill="${c}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`}
function star(cx,cy,r1,r2,n,rot=0){let p=[];for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,r=i%2?r1:r2;p.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1))}return p.join(' ')}

// ---------- tarjetas del marcador (aparecen en el gancho y suben arriba) ----------
const CARD_ICON=[
 `<g transform="translate(180,50)"><rect x="-26" y="-30" width="52" height="60" rx="10" fill="#4B2A9A"/><rect x="-18" y="-22" width="16" height="16" rx="4" fill="#FF3D7F"/><rect x="2" y="-22" width="16" height="16" rx="4" fill="#4FE3FF"/><rect x="-18" y="0" width="16" height="16" rx="4" fill="#7BE06A"/><rect x="2" y="0" width="16" height="16" rx="4" fill="#FFB020"/></g>`,
 `<g transform="translate(180,50)"><rect x="-32" y="-18" width="56" height="36" rx="9" fill="#fff" stroke="#4B2A9A" stroke-width="6"/><rect x="24" y="-8" width="8" height="16" rx="3" fill="#4B2A9A"/><rect x="-25" y="-11" width="14" height="22" rx="4" fill="#FF3D7F"/></g>`,
 `<g transform="translate(180,50)"><path d="M0 -34 C18 -8 28 4 28 16 a28 28 0 0 1 -56 0 C-28 4 -18 -8 0 -34z" fill="#4FE3FF" stroke="#4B2A9A" stroke-width="6"/></g>`
];
const LOCK=`<g transform="translate(180,52)"><rect x="-26" y="-6" width="52" height="40" rx="10" fill="#FFB020" stroke="#4B2A9A" stroke-width="6"/><path class="shackle" d="M-14 -6 v-12 a14 14 0 0 1 28 0 v12" fill="none" stroke="#4B2A9A" stroke-width="8" stroke-linecap="round"/><circle cx="0" cy="14" r="6" fill="#4B2A9A"/></g>`;
function buildCards(){
 const h=[];
 for(let i=0;i<3;i++){
  h.push(`<div class="mc" id="c${i+1}"><svg width="220" height="100" viewBox="0 0 220 100">
   <rect x="3" y="9" width="214" height="90" rx="24" fill="${INK}" opacity=".5"/>
   <rect x="3" y="3" width="214" height="90" rx="24" fill="#fff" stroke="${INK}" stroke-width="6"/>
   <circle cx="40" cy="48" r="29" fill="#FFD400" stroke="${INK}" stroke-width="5"/>
   <text x="40" y="62" text-anchor="middle" font-size="40" font-weight="900" fill="${INK}">${i+1}</text>
   <text x="80" y="${i==2?40:56}" font-size="23" font-weight="900" fill="#7A6AA8" letter-spacing="1">MITO</text>
   ${i==2?`<text class="qq" x="80" y="72" font-size="30" font-weight="900" fill="#FF3D7F">???</text>`:''}
   <g class="ic">${i==2?`<g class="icLock">${LOCK}</g><g class="icOpen" opacity="0">${CARD_ICON[2]}</g>`:CARD_ICON[i]}</g>
   <g class="crack" opacity="0" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M120 3 L108 30 L128 44 L112 70 L124 93"/><path d="M108 30 L84 38 M128 44 L160 40 M112 70 L88 80"/></g>
   <g class="xx" opacity="0"><circle cx="40" cy="48" r="29" fill="#FF3D7F" stroke="${INK}" stroke-width="5"/><path d="M27 35 L53 61 M53 35 L27 61" stroke="#fff" stroke-width="9" stroke-linecap="round"/></g>
  </svg></div>`);
 }
 $('tracker').innerHTML=h.join('');
}
// posición/escala de cada tarjeta según el tiempo
function cardState(i,T){
 // gancho: apilado grande en el centro
 const big={x:540, y:[570,870,1170][i], s:2.5};
 const trk={x:TRK[i].x,y:TRK[i].y,s:1};
 const appear=[0.30,0.95,1.60][i];
 let p=back((T-appear)/0.35);
 let fly=eio((T-4.40)/0.65);
 let x=lerp(big.x,trk.x,fly), y=lerp(big.y,trk.y,fly), s=lerp(big.s,trk.s,fly);
 // tarjetas del marcador flotan suave
 const bob=Math.sin(T*3+i*1.7)*4*fly;
 let sc=s*(T<appear?0:p);
 let rot=0;
 if(i==2&&T<24.85){ // la 3 tiembla: suspenso
  const k=T>2.6&&T<4.4?1:0.35; rot=Math.sin(T*28)*2.2*k*(1-fly*0.6);
  if(T>2.76&&T<4.4){sc*=1+0.05*Math.sin((T-2.76)*9)}
 }
 return {x,y:y+bob,sc,rot,fly};
}
function renderCards(T){
 for(let i=0;i<3;i++){
  const e=$('c'+(i+1)),st=cardState(i,T);
  e.style.transform=`translate(${st.x-110}px,${st.y-50}px) scale(${Math.max(st.sc,0.0001)}) rotate(${st.rot}deg)`;
  e.style.opacity=st.sc>0.001?1:0;
  const brk=[T1,T2,T3][i];
  const dead=T>=brk;
  const cr=e.querySelector('.crack'),xx=e.querySelector('.xx');
  cr.style.opacity=dead?1:0; xx.setAttribute('opacity',dead?clamp((T-brk)/0.12):0);
  if(dead){const k=clamp((T-brk)/0.5);e.querySelector('svg').style.filter=`saturate(${1-0.7*k}) brightness(${1-0.12*k})`}else e.querySelector('svg').style.filter='none';
  if(i==2){
   const open=T>=24.85;
   const q=e.querySelector('.qq');q.style.opacity=open?0:1;
   const lk=e.querySelector('.icLock'),op=e.querySelector('.icOpen');
   const u=clamp((T-24.85)/0.25);
   lk.setAttribute('opacity',open?1-u:1); op.setAttribute('opacity',open?u:0);
   lk.style.transformOrigin='180px 52px';lk.style.transform=open?`scale(${1+0.4*Math.sin(u*Math.PI)}) rotate(${-20*u}deg)`:'none';
  }
 }
}

function buildChispa(){
 $('chispa').innerHTML=`<div id="chp" class="abs" style="left:20px;top:1065px;width:280px;height:323px;transform-origin:140px 300px">
 <svg width="280" height="323" viewBox="150 60 500 580">

  <rect x="590" y="360" width="60" height="120" rx="26" fill="#FFB800" stroke="#0A2E8A" stroke-width="10"/>

  <g id="eyes"><ellipse id="eL" cx="335" cy="385" rx="34" ry="44" fill="#4FE3FF"/><ellipse id="eR" cx="465" cy="385" rx="34" ry="44" fill="#4FE3FF"/>
   <circle id="gL" cx="347" cy="370" r="11" fill="#fff"/><circle id="gR" cx="477" cy="370" r="11" fill="#fff"/></g>
  <path id="mouth" d="M345 450 Q400 492 455 450" stroke="#4FE3FF" stroke-width="14" fill="none" stroke-linecap="round"/>
  <ellipse id="mo" cx="400" cy="462" rx="30" ry="0" fill="#4FE3FF"/>
  <circle cx="283" cy="450" r="16" fill="#FF7AB6" opacity=".55"/><circle cx="517" cy="450" r="16" fill="#FF7AB6" opacity=".55"/>
  <rect x="325" y="560" width="150" height="74" rx="30" fill="#0A2E8A" stroke="#FFD000" stroke-width="8"/>
  <text x="400" y="615" text-anchor="middle" font-family="Inter" font-weight="800" font-size="50" fill="#FFE45C" letter-spacing="2">IA</text>
  <g id="hand" transform="translate(600,470)"><path d="M0 0 q60 -10 90 -70" stroke="#FFB800" stroke-width="30" fill="none" stroke-linecap="round"/><circle cx="92" cy="-78" r="32" fill="#FFE45C" stroke="#0A2E8A" stroke-width="8"/></g>
 </svg></div>`;
}
function renderChispa(T){
 const el=$('chp');
 // entra en 4.6 (cuando las tarjetas suben)
 const inn=back((T-4.55)/0.5);
 let bob=Math.sin(T*4.2)*7, tilt=Math.sin(T*2.4)*3;
 let jump=0,mood='happy',look=0;
 for(const t of [T1,T2,T3]){const d=T-t;if(d>0&&d<0.5){jump=-70*Math.sin(clamp(d/0.5)*Math.PI)}
  if(d>-0.5&&d<0.18)mood='shock'; else if(d>=0.18&&d<1.6)mood='cheer'}
 if(T>33.65&&T<40.95)mood='cheer';
 if(T>=40.95)mood='cheer';
 if((T>5&&T<T1-0.5)||(T>14.45&&T<T2-0.5)||(T>24.85&&T<T3-0.5))mood='think';
 el.style.transform=`translate(${lerp(-420,0,clamp(inn))}px,${jump+bob}px) rotate(${tilt}deg) scale(${T<4.55?0:1})`;
 // ojos / boca
 const blink=((T%3.1)>3.0)?0.15:1;
 let ry=44*blink,eyeS=1,mouthD='M345 450 Q400 492 455 450',mo=0;
 if(mood=='shock'){ry=56;eyeS=1;mo=34;}
 if(mood=='think'){mouthD='M355 462 Q400 450 445 462';look=1}
 if(mood=='cheer'){mouthD='M335 440 Q400 520 465 440'}
 $('eL').setAttribute('ry',ry);$('eR').setAttribute('ry',ry);
 const gx=look*10;$('gL').setAttribute('cx',347+gx);$('gR').setAttribute('cx',477+gx);
 $('mouth').setAttribute('d',mouthD);$('mouth').style.opacity=mo?0:1;
 $('mo').setAttribute('ry',mo);
 $('ant').style.transformOrigin='400px 210px';$('ant').style.transform=`rotate(${Math.sin(T*6)*(mood=='shock'?14:5)}deg)`;
 // mano saludando en el final
 const hand=$('hand');
 if(T>=40.95){const w=Math.sin((T-40.95)*9)*18;hand.setAttribute('transform',`translate(600,470) rotate(${w} 0 0)`);hand.style.opacity=1}
 else if(T>33.65&&T<40.95){hand.setAttribute('transform','translate(600,470)');hand.style.opacity=1}
 else hand.style.opacity=0;
}

// ---------- utilidades de escena ----------
function pop(el,t0,T,d=.35,from=0.2){const p=back((T-t0)/d);el.style.opacity=T<t0?0:clamp((T-t0)/0.12);el.style.transform=`scale(${T<t0?0:lerp(from,1,p)})`}
function slideIn(el,t0,T,dx=700,d=.45){const p=eo((T-t0)/d);el.style.opacity=T<t0?0:1;el.style.transform=`translateX(${(1-p)*dx}px)`}
function bumpAt(el,t0,T,amt=.18,base=1){const d=T-t0;return d>0&&d<0.35?base*(1+amt*Math.sin(d/0.35*Math.PI)):base}

const R=[];
function claimHTML(n,txt){return `<div class="claim"><span class="tag">MITO ${n}</span><div class="tx">${txt}</div></div>`}

 const sc=[];
 // S0 gancho
 sc.push(`<div class="scene" id="s0">

 // S2 mito 1: explicación
 sc.push(`<div class="scene" id="s2">

  <div class="abs" id="s2g" style="left:450px;top:410px;width:180px;height:180px"><svg width="180" height="180" viewBox="-90 -90 180 180"><g id="s2gear"><circle r="52" fill="#FFD400" stroke="${INK}" stroke-width="9"/>${[0,1,2,3,4,5,6,7].map(i=>`<rect x="-14" y="-76" width="28" height="30" rx="7" fill="#FFD400" stroke="${INK}" stroke-width="7" transform="rotate(${i*45})"/>`).join('')}<circle r="22" fill="#2B1B5A"/></g></svg></div>

  <div class="abs" id="s2ph" style="left:140px;top:720px;width:780px;height:380px">
   <svg width="780" height="380" viewBox="0 0 780 380">
    ${[0,1,2,3].map(i=>`<g id="s2a${i}" transform="translate(${20+i*185},60)"><g class="fr"><g transform="scale(1)">${appCard(COLS[i],ICONS[i])}</g>
      <rect width="150" height="190" rx="26" fill="#BFEFFF" opacity="0" class="ice" stroke="#fff" stroke-width="6"/>
      <g class="snow" opacity="0" transform="translate(75,95)" stroke="#fff" stroke-width="9" stroke-linecap="round"><path d="M0 -42 V42 M-36 -21 L36 21 M-36 21 L36 -21"/></g></g></g>`).join('')}
    <g id="s2spin" transform="translate(750,40)" opacity="0"><circle r="26" fill="none" stroke="#FFD400" stroke-width="10" stroke-dasharray="40 120" stroke-linecap="round"/></g>
   </svg></div>
  <div class="abs" id="s2bat" style="left:300px;top:990px;width:480px;height:120px;opacity:0"><svg width="500" height="120" viewBox="0 0 500 120">${battery('b2',440,110)}</svg></div>

 else if(T<22.15)lvl=50+30*Math.sin((T-20.84)*5);
 else if(T<23.0)lvl=lerp(50,0,eio((T-22.2)/0.7));
 else lvl=0;
 lvl=clamp(lvl,0,100);
 const L=b.querySelector('.lvl');L.setAttribute('width',Math.max(0.1,(500-32)*lvl/100));L.setAttribute('fill',lvl<22?'#FF3D7F':'#7BE06A');b.querySelector('.pct').textContent=Math.round(lvl)+'%';
 const z=$('s4z');z.style.opacity=(T>=20.84&&T<22.2)?1:(T>=22.2?clamp(1-(T-22.2)/0.25):0);z.style.transform=`scale(${lerp(.4,1,back((T-20.84)/.35))})`;
 const w=$('s4w');w.style.opacity=T<22.9?0:1;w.style.transform=`translateY(${(1-eo((T-22.9)/0.4))*200}px) scale(.88)`;
 $('s4life').setAttribute('width',lerp(760,420,eio((T-23.36)/1.2)));
 $('s4life').setAttribute('fill',T>23.9?'#FF3D7F':'#7BE06A');
 const t=$('s4wt');t.setAttribute('opacity',T>=24.16?1:0);
};
R[5]=(lt,d,T)=>{
 const w=$('cw3');w.style.opacity=T<25.0?0:1;
 if(T<T3)w.style.transform=`translateY(${(1-eo((T-25.0)/0.4))*-300}px) scale(${T>T3-.06?.96:1})`;
 const s=$('s5s');s.style.opacity=T<25.5?0:1;s.style.transform=`scale(${lerp(.5,1,back((T-25.5)/.4))})`;
 const down=eio((T-27.3)/0.9);
 $('s5phone').setAttribute('transform',`translate(0,${down*150}) rotate(${Math.sin(T*10)*(1-down)*4} 305 135)`);
 $('s5dr').style.opacity=1-down;
 const dd=qa('#s5dr path');dd.forEach((p,i)=>p.setAttribute('transform',`translate(0,${((T*160+i*90)%140)})`));
 $('s5z').setAttribute('opacity',T>28.0?1:0);
};
R[6]=(lt,d,T)=>{
 const c=$('s6c');c.style.transform=`translateX(-50%) scale(${T<29.45?0:lerp(.4,1,back((T-29.45)/.35))}) rotate(${Math.sin(T*8)*1.2}deg)`;c.style.opacity=T<29.45?0:1;
 const a=$('s6a');a.style.opacity=T<29.56?0:(T<31.7?1:1-eo((T-31.7)/0.25));a.style.transform=`scale(${lerp(.5,1,back((T-29.56)/.3))})`;
 const n=$('s6no');const showNo=T>=29.9&&T<31.8;n.style.opacity=showNo?1:(T>=31.8?clamp(1-(T-31.8)/0.25):0);
 n.style.transform=`scale(${lerp(.3,1,back((T-29.9)/.4))})`;
 $('s6ban').style.opacity=T>30.5?1:0;
 const p=$('s6p');p.style.opacity=T<31.9?0:1;p.style.transform=`scale(${lerp(.5,1,back((T-31.9)/.4))})`;
 qa('#s6g .gr').forEach((g,i)=>{const t0=32.3+i*0.07,k=clamp((T-t0)/0.55);g.setAttribute('cy',lerp(-30,225,ei(k)));g.setAttribute('cx',200+i*14+Math.sin(T*8+i)*4);g.style.opacity=T<t0?0:1});
 $('s6al').setAttribute('opacity',T>32.9?1:0);
 const t=$('s6t');t.style.opacity=T<32.9?0:1;t.style.transform=`scale(${lerp(.4,1,back((T-32.9)/.35))}) rotate(${Math.sin(T*10)*1.5}deg)`;
};
const STEPT=[34.55,35.55,36.4,37.65,39.1];
R[7]=(lt,d,T)=>{
 const h=$('s7h');h.style.transform=`scale(${bumpAt(h,33.8,T,.12,lerp(.3,1,back((T-33.7)/.4)))})`;h.style.opacity=T<33.7?0:1;
 for(let i=0;i<5;i++){
  const r=$('s7r'+i);slideIn(r,STEPT[i]-0.05,T,900,.5);
  const ck=r.querySelector('.ck');ck.setAttribute('stroke-dashoffset',80*(1-clamp((T-STEPT[i]-0.35)/0.3)));
  r.style.transform+=` scale(${bumpAt(r,STEPT[i]+0.35,T,.06)})`;
 }
};
R[8]=(lt,d,T)=>{
 const q=$('s8q');q.style.opacity=T<41.0?0:1;q.style.transform=`scale(${lerp(.4,1,back((T-41.0)/.4))})`;
 const times=[41.5,42.0,42.45];
 for(let i=0;i<3;i++){const e=$('s8n'+i);const p=back((T-times[i])/0.35);const pulse=1+0.07*Math.sin(T*7+i*2);e.style.opacity=T<times[i]?0:1;e.style.transform=`scale(${T<times[i]?0:lerp(.2,1,p)*pulse})`}
 const c=$('s8c');c.style.opacity=T<42.96?0:1;c.style.transform=`scale(${lerp(.4,1,back((T-42.96)/.35))})`;
 [1,2,3].forEach(k=>$('d'+k).setAttribute('cy',70+Math.sin(T*9-k)*10));
 const b=$('s8b');b.style.opacity=T<43.7?0:1;b.style.transform=`translateY(${(1-eo((T-43.7)/0.4))*200}px)`;
 let sc=1;const press=44.35;
 if(T>press-0.12&&T<press+0.15)sc=0.9;
 if(T>=press+0.15)sc=1+0.06*Math.sin(clamp((T-press-0.15)/0.4)*Math.PI);
 $('s8bt').style.transformOrigin='230px 70px';$('s8bt').style.transform=`scale(${sc})`;
 const done=T>=press;
 $('s8br').setAttribute('fill',done?'#8E8AA8':'#FF2D2D');$('s8bx').textContent=done?'SUSCRITO ✓':'SUSCRIBIRSE';
 $('s8bell').style.transformOrigin='0 -30px';$('s8bell').style.transform=`rotate(${done?Math.sin((T-press)*20)*16*(1-clamp((T-press)/1.2)):Math.sin(T*14)*8}deg)`;
 // confeti
 const cf=$('s8cf');
 if(!cf._built){cf._built=1;cf.innerHTML=Array.from({length:40},(_,i)=>`<div class="abs cfp" style="width:22px;height:22px;border-radius:${i%2?'50%':'4px'};background:${['#FFD400','#FF3D7F','#4FE3FF','#7BE06A'][i%4]};border:4px solid ${INK};left:540px;top:1160px;opacity:0"></div>`).join('');qa('.cfp',cf).forEach(e=>{e._v={vx:(rng()-.5)*1300,vy:-(500+rng()*700),r:(rng()-.5)*900}})}
 qa('.cfp',cf).forEach(e=>{const dd=T-press;if(dd<0||dd>1.8){e.style.opacity=0;return}e.style.opacity=1-clamp((dd-1.2)/0.6);
  e.style.transform=`translate(${e._v.vx*dd}px,${e._v.vy*dd+0.5*1800*dd*dd}px) rotate(${e._v.r*dd}deg)`});
};

// ---------- impactos (martillo, estallido, sello, sacudida) ----------
function renderImpacts(T){
 let shake=0,flash=0;
 const cws=['cw1','cw2','cw3'];
 let hamOp=0,hamT='',burstOp=0,burstT='',stampOp=0,stampT='',stampTxt='FALSO';
 [T1,T2,T3].forEach((Tt,k)=>{
  const d=T-Tt;
  // martillo
  if(d>-0.55&&d<0.5){
   hamOp=1;
   const p=ei((d+0.5)/0.5);
   let dy=d<0?lerp(-700,0,p):-90*Math.sin(clamp(d/0.3)*Math.PI)-Math.max(0,d-0.3)*600;
   let rot=d<0?lerp(40,0,p):lerp(0,-10,clamp(d/0.3));
   hamT=`translate(${150-150}px,${dy+ (440-480+ (k==1?0:0))}px) rotate(${rot}deg)`;
   if(d>0.3)hamOp=1-clamp((d-0.3)/0.2);
  }
  // estallido
  if(d>=0&&d<0.4){burstOp=1-clamp(d/0.4);burstT=`scale(${lerp(.3,1.4,eo(d/0.25))}) rotate(${d*40}deg)`}
  // sello FALSO
  if(d>=0.04&&d<1.3){stampOp=1;const s=lerp(3,1,elastic(clamp((d-0.04)/0.45)));stampT=`scale(${s}) rotate(${-9}deg)`;stampOp=d>1.0?1-clamp((d-1.0)/0.3):1;stampTxt=k==2?'¡FALSO!':'FALSO'}
  // sacudida y destello
  if(d>=0&&d<0.5){shake=Math.max(shake,22*Math.exp(-d*7));flash=Math.max(flash,0.8*(1-clamp(d/0.18)))}
  // astillas
  const w=$(cws[k]);
  if(w._sh){
   const hide=T>=Tt;
   w.querySelector('.claim').style.visibility=hide?'hidden':'visible';
   w._sh.forEach(s=>{
    if(!hide||d>1.1){s.style.opacity=0;return}
    s.style.opacity=1-clamp((d-0.55)/0.5);
    const v=s._v;s.style.transform=`translate(${v.vx*d}px,${v.vy*d+0.5*2200*d*d}px) rotate(${v.rv*d}deg)`;
   });
  }
 });
 // posición base del martillo/estallido/sello: centro de la tarjeta (x 540, y 425)
 const ham=$('ham');ham.style.opacity=hamOp;ham.style.transform=hamT||'translateY(-900px)';
 ham.style.left='390px';ham.style.top='-55px'; // cabeza apoya en y≈425
 const bu=$('burst');bu.style.opacity=burstOp;bu.style.transform=burstT||'scale(0)';bu.style.top='185px';
 const st=$('stamp');st.style.opacity=stampOp;st.style.transform=stampT||'scale(0)';$('stampt').textContent=stampTxt;
 $('flash').style.opacity=flash;
 return shake;
}

// ---------- subtítulos por palabra ----------
let GROUPS=[];
function buildGroups(){
 GROUPS=[];let cur=[];
 W.forEach((w,i)=>{cur.push(i);const end=/[.!?:]$/.test(w.text)||/,$/.test(w.text);if(cur.length>=3||end&&cur.length>=2||cur.length>=3){GROUPS.push(cur);cur=[]}});
 if(cur.length)GROUPS.push(cur);
}
function renderSubs(T){
 const box=$('subs');let gi=-1;
 for(let i=0;i<GROUPS.length;i++){if(W[GROUPS[i][0]].start-0.05<=T)gi=i}
 if(gi<0||T>VOICE+0.4||T<0.07){box.innerHTML='';box.style.opacity=0;return}
 const g=GROUPS[gi];
 box.innerHTML=g.map(i=>{const w=W[i];const on=T>=w.start-0.03&&T<(W[i+1]?W[i+1].start:w.end+0.4);
  const p=clamp((T-w.start)/0.16);const sc=on?1+0.16*Math.sin(Math.PI*p):1;
  return `<span class="sw${on?' on':''}" style="transform:scale(${sc})">${w.text.replace(/[¿¡]/g,'')}</span>`}).join('');
 const gs=W[g[0]].start;const pp=eo((T-gs)/0.14);box.style.opacity=pp;box.style.transform=`translateY(${(1-pp)*26}px)`;
}

// ---------- render principal ----------
function render(T){
 // fondo vivo
 $('rays').style.background=`repeating-conic-gradient(from ${T*6}deg at 50% 36%,rgba(255,255,255,.055) 0deg 9deg,transparent 9deg 18deg)`;
 $('bg').style.transform=`scale(${1+0.02*Math.sin(T*1.3)})`;
 // escena activa
 let idx=0;for(let i=0;i<SC.length;i++)if(T>=SC[i])idx=i;
 for(let i=0;i<SC.length;i++){$('s'+i).style.opacity=(i===idx)?1:0}
 const st=SC[idx],en=idx+1<SC.length?SC[idx+1]:DUR;
 $('s0p').style.opacity=0; R[idx](T-st,en-st,T);
 // cámara: zoom suave por escena + latido
 const lt=T-st;let zoom=1+0.045*clamp(lt/(en-st))+0.012*Math.sin(T*5);
 let cx=Math.sin(T*1.7)*6,cy=Math.cos(T*1.3)*5;
 renderCards(T);renderChispa(T);
 const shake=renderImpacts(T);
 const sx=shake*Math.sin(T*90),sy=shake*Math.cos(T*77);
 $('cam').style.transform=`translate(${cx+sx}px,${cy+sy}px) scale(${zoom})`;
 // transiciones: diagonal rosa + celeste
 let wp=-1600,w2=-1600;
 for(let i=1;i<SC.length;i++){
  const a=(T-SC[i]+0.30)/0.62;
  if(a>0&&a<1){wp=lerp(1500,-1900,eio(a));w2=lerp(1750,-1650,eio(a))}
 }
 $('wipe').style.left=wp+'px';$('wipe2').style.left=w2+'px';
 renderSubs(T);
}
async function init(data){
 W=data.words;VOICE=data.voice_dur;DUR=data.dur;
 buildCards();buildChispa();buildScenes();buildGroups();
 await document.fonts.ready;
 return {n:W.length,groups:GROUPS.length,DUR};
}
