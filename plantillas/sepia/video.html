<!doctype html><html><head><meta charset="utf-8">
<!-- Plantilla "sepia": grabado antiguo sobre pergamino para la serie "Estaba escrito" (Bases Bíblicas).
     Todo se dibuja con SVG por código. Las escenas se eligen en escenas.json y se anclan a palabras
     de words.json, así que cambiar la voz no obliga a tocar este archivo. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#e9d6a8}
#stage{position:absolute;inset:0;overflow:hidden}
.L{position:absolute;inset:0;transform-origin:0 0}
.L svg{position:absolute;left:0;top:0;overflow:visible}
.ov{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse 78% 66% at 50% 46%,rgba(60,36,12,0) 55%,rgba(60,36,12,.34) 82%,rgba(40,22,6,.72) 100%)}
#grain{mix-blend-mode:multiply;opacity:.5}
#subs{position:absolute;left:40px;right:40px;top:1392px;height:170px;text-align:center;font-family:'Inter Display','Inter';font-weight:900;font-size:70px;line-height:1.1;text-transform:uppercase;letter-spacing:-1px}
#subs span{display:inline-block;margin:0 12px;color:#fff8e8;-webkit-text-stroke:15px #2a1b0e;paint-order:stroke fill;transform-origin:50% 70%}
#subs span.on{color:#7fe9da}
#chip{position:absolute;left:0;right:0;top:268px;text-align:center;display:none}
#chip div{display:inline-block;padding:12px 40px 14px;background:#f6e9c8;border:5px solid #3a2817;box-shadow:0 0 0 4px #f6e9c8,0 0 0 7px #3a2817,0 12px 0 rgba(58,40,23,.28);font-family:'Bitstream Charter','Caladea','DejaVu Serif',serif;font-weight:700;font-size:50px;color:#3a2817;white-space:nowrap;transform-origin:50% 50%}
#chip i{font-style:normal;font-size:30px;color:#8c2f1c;letter-spacing:3px;margin-left:16px}
</style></head><body>
<div id="stage">
 <div class="L" id="LB"><svg id="sB" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
 <div class="L" id="LA"><svg id="sA" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
 <svg class="ov" id="grain" width="1080" height="1920"><filter id="fGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .25  0 0 0 .55 0"/></filter><filter id="fStain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".004 .006" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .36  0 0 0 0 .18  1.4 0 0 0 -.5"/></filter><rect width="1080" height="1920" filter="url(#fStain)"/><rect width="1080" height="1920" filter="url(#fGrain)"/></svg>
 <div class="ov" id="vig"></div>
 <svg class="ov" id="hud" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
 <div id="chip"><div id="chipIn"></div></div>
 <div id="subs"></div>
 <svg class="ov" id="top" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
</div>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<script>
const $=id=>document.getElementById(id);
const INK='#3a2817',P1='#f6e9c8',P2='#e6cd98',P3='#cba86c',P4='#a07d48',P5='#6e512b',RED='#8c2f1c',BLU='#6f8c98',GOLD='#d9a43c';
const SERIF="font-family=\"'Bitstream Charter','Caladea','DejaVu Serif',serif\"";
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3),eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const P=(L,a,d)=>clamp((L-a)/d);
function R(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ]/g,'');

$('defs').innerHTML=`
<pattern id="h1" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="11" stroke="${INK}" stroke-width="2.6"/></pattern>
<pattern id="h2" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)"><line x1="0" y1="0" x2="0" y2="11" stroke="${INK}" stroke-width="2.6"/></pattern>
<pattern id="h3" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="16" stroke="${INK}" stroke-width="2"/></pattern>
<pattern id="hh" width="14" height="14" patternUnits="userSpaceOnUse"><line x1="0" y1="7" x2="14" y2="7" stroke="${INK}" stroke-width="2"/></pattern>
<linearGradient id="gDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c78f"/><stop offset=".5" stop-color="${P1}"/><stop offset="1" stop-color="#ecd7a6"/></linearGradient>
<linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6a3c"/><stop offset=".45" stop-color="#cba86c"/><stop offset="1" stop-color="#f0dcae"/></linearGradient>
<linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f2c17"/><stop offset=".6" stop-color="#7a5c33"/><stop offset="1" stop-color="#b8935a"/></linearGradient>
<radialGradient id="gGlow"><stop offset="0" stop-color="#fffbe6" stop-opacity="1"/><stop offset=".4" stop-color="#fbe9b4" stop-opacity=".75"/><stop offset="1" stop-color="#f3d58c" stop-opacity="0"/></radialGradient>
<radialGradient id="gDark"><stop offset="0" stop-color="#2a1b0e" stop-opacity=".0"/><stop offset="1" stop-color="#2a1b0e" stop-opacity=".55"/></radialGradient>
<linearGradient id="gParch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf1d6"/><stop offset="1" stop-color="#ecd9ab"/></linearGradient>
<linearGradient id="gRoll" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${P5}"/><stop offset=".35" stop-color="${P2}"/><stop offset=".6" stop-color="${P3}"/><stop offset="1" stop-color="${P5}"/></linearGradient>
<filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>`;

/* ---------- piezas de grabado ---------- */
const S=(w=5,c=INK)=>`stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
function skyLines(y0,y1,n,op=.22,seed=1){let s='';for(let i=0;i<n;i++){const y=lerp(y0,y1,Math.pow(i/n,1.5)),a=20+R(seed+i)*14;let d=`M-200 ${y}`;for(let x=-200;x<1300;x+=150)d+=` q75 ${-a*(R(seed+i+x)-.5)} 150 0`;s+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="${2+R(i)*1.5}" opacity="${op*(1-i/n*.7)}"/>`}return s}
function sky(g='gDay',lines=30,seed=1){return `<rect x="-300" y="-300" width="1680" height="2500" fill="url(#${g})"/>`+skyLines(60,1000,lines,.2,seed)}
function rays(x,y,n,r0,r1,rot=0,op=.6,col=INK,w=3){let s='';for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n,k=i%2?.72:1,c=Math.cos(a),sn=Math.sin(a);s+=`<line x1="${x+c*r0}" y1="${y+sn*r0}" x2="${x+c*r1*k}" y2="${y+sn*r1*k}"/>`}return `<g stroke="${col}" stroke-width="${w}" stroke-linecap="round" opacity="${op}">${s}</g>`}
function wedges(x,y,n,len,rot,op,spread=.06){let s='';for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;s+=`<path d="M${x} ${y} L${x+Math.cos(a-spread)*len} ${y+Math.sin(a-spread)*len} L${x+Math.cos(a+spread)*len} ${y+Math.sin(a+spread)*len}Z"/>`}return `<g fill="#fff6d6" opacity="${op}">${s}</g>`}
function glow(x,y,r,op=1){return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gGlow)" opacity="${op}"/>`}
function cloud(x,y,s,op=1,fill=P1){return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><path d="M-170 40 Q-215 0 -150 -40 Q-150 -105 -70 -92 Q-30 -160 55 -112 Q130 -140 150 -60 Q215 -40 180 40Z" fill="${fill}" ${S(5)}/><path d="M-110 -30 q28 -30 58 -4 M-30 -66 q34 -34 70 -2 M70 -40 q26 -24 54 0 M-60 6 q30 -22 62 0 M30 4 q26 -20 56 0" fill="none" ${S(3.5)} opacity=".65"/><path d="M-150 22 h300 M-120 34 h230" fill="none" ${S(2.5)} opacity=".4"/></g>`}
function hills(yb,amp,seed,fill,hatch='h3',dx=0,op=.35){let d=`M-300 2400 L-300 ${yb}`;for(let x=-300;x<=1400;x+=40){const y=yb-amp*(.5+.32*Math.sin((x+dx)*.0058+seed)+.18*Math.sin((x+dx)*.016+seed*2.3));d+=` L${x} ${y.toFixed(1)}`}d+=' L1400 2400Z';return `<path d="${d}" fill="${fill}" ${S(5)}/><path d="${d}" fill="url(#${hatch})" opacity="${op}"/>`}
function ground(y,fill=P3,seed=1){let d=`M-300 2400 L-300 ${y}`;for(let x=-300;x<=1400;x+=60)d+=` L${x} ${(y-14*Math.sin(x*.009+seed)).toFixed(1)}`;d+=' L1400 2400Z';let t='';for(let i=0;i<46;i++){const x=-200+R(seed+i)*1500,yy=y+20+R(seed+i*3)*520,h=14+R(i*7)*22;t+=`<path d="M${x} ${yy} q-6 ${-h} -12 ${-h*1.2} M${x} ${yy} q2 ${-h} 0 ${-h*1.5} M${x} ${yy} q8 ${-h} 14 ${-h*1.1}"/>`}return `<path d="${d}" fill="${fill}" ${S(5)}/><path d="${d}" fill="url(#hh)" opacity=".22"/><g fill="none" ${S(3)} opacity=".7">${t}</g>`}
function tree(x,yb,s,L=0,seed=1){const sw=Math.sin(L*1.1+seed)*5;let c1='',c2='',c3='';for(let i=0;i<17;i++){const cx=(R(seed+i)-.5)*600+sw*(.4+R(i)),cy=-640+(R(seed+i*9)-.5)*330,r=92+R(seed+i*3)*70;c1+=`<circle cx="${cx}" cy="${cy}" r="${r+7}" fill="${INK}"/>`;c2+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${i%3?P3:P2}"/>`;for(let k=0;k<5;k++){const a=R(i*5+k)*6.28,rr=r*(.2+R(i+k*3)*.6),lx=cx+Math.cos(a)*rr,ly=cy+Math.sin(a)*rr;c3+=`<path d="M${lx-16} ${ly} q16 -20 32 0"/>`}}
 return `<g transform="translate(${x},${yb}) scale(${s})"><path d="M-70 10 Q-40 -190 -66 -330 Q-90 -420 -220 -500 L-150 -520 Q-60 -470 -20 -400 Q-8 -470 -30 -560 L40 -560 Q30 -470 44 -390 Q90 -470 200 -500 L230 -450 Q110 -410 74 -320 Q46 -180 86 10Z" fill="${P4}" ${S(6)}/><path d="M-30 -20 Q-6 -200 -30 -360 M10 -10 Q30 -200 8 -380 M44 -30 Q30 -160 50 -300 M-50 -120 q16 -10 30 4 M10 -220 q18 -8 30 6" fill="none" ${S(3.5)} opacity=".7"/><path d="M20 10 Q46 -180 74 -320 Q110 -410 230 -450 L200 -500 Q90 -470 44 -390 Q40 -200 20 10Z" fill="url(#h1)" opacity=".5"/>${c1}${c2}<g fill="none" ${S(3.5)} opacity=".6">${c3}</g></g>`}
function bush(x,y,s,seed=1){let a='',b='',c='';for(let i=0;i<7;i++){const cx=(R(seed+i)-.5)*220,cy=-40-R(seed+i*2)*70,r=42+R(seed+i*4)*30;a+=`<circle cx="${cx}" cy="${cy}" r="${r+6}" fill="${INK}"/>`;b+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${i%2?P3:P4}"/>`;c+=`<path d="M${cx-14} ${cy} q14 -16 28 0"/>`}return `<g transform="translate(${x},${y}) scale(${s})">${a}${b}<g fill="none" ${S(3)} opacity=".6">${c}</g></g>`}
function frond(x,y,s,rot=0,L=0){let f='';for(let i=0;i<6;i++){const a=-150+i*24+Math.sin(L*1.3+i)*3;f+=`<path d="M0 0 Q60 -70 150 -60 Q70 -30 0 0Z" transform="rotate(${a})" fill="${i%2?P4:P3}" ${S(4)}/>`}return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">${f}</g>`}
function smooth(pts){let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=` Q${pts[i][0]} ${pts[i][1]} ${mx} ${my}`}const l=pts[pts.length-1];return d+` L${l[0]} ${l[1]}`}
function serpentBody(pts,w=44,fill=P3){const d=smooth(pts);return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+12}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${fill}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${INK}" stroke-width="${w*.5}" stroke-dasharray="3 17" opacity=".55"/><path d="${d}" fill="none" stroke="${INK}" stroke-width="${w*.16}" stroke-dasharray="2 9" opacity=".4" transform="translate(0,${w*.3})"/>`}
function serpentHead(x,y,s,rot=0,tongue=1,flat=0){return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s},${s*(1-flat*.45)})"><path d="M-50 -34 Q30 -58 96 -18 Q118 0 96 18 Q30 58 -50 34Z" fill="${P3}" ${S(7)}/><path d="M-30 -30 Q30 -46 80 -16" fill="none" ${S(3)} opacity=".6"/>${flat>.5?`<path d="M40 -22 l20 16 M60 -22 l-20 16" ${S(6)} fill="none"/>`:`<ellipse cx="50" cy="-14" rx="12" ry="8" fill="${INK}"/><circle cx="53" cy="-16" r="3" fill="${P1}"/>`}${tongue?`<path d="M104 2 l44 -4 l22 -16 M148 -2 l24 14" fill="none" ${S(6,RED)}/>`:''}</g>`}
/* figura con túnica, sin rasgos de rostro (los personajes no cambian de cara entre escenas) */
function fig(x,yb,s,o={}){const t=o.tone||P2,dir=o.dir||1,hair=o.hair||P5;const veil=o.veil?`<path d="M-58 -428 Q-66 -512 0 -512 Q66 -512 58 -428 Q84 -320 70 -236 L-70 -236 Q-84 -320 -58 -428Z" fill="${o.veil}" ${S(5)}/>`:'';
 const arm=o.arm==='up'?`<path d="M40 -330 Q100 -400 120 -480 L150 -470 Q130 -380 70 -300Z" fill="${t}" ${S(5)}/><circle cx="138" cy="-486" r="18" fill="${P1}" ${S(4)}/>`:o.arm==='point'?`<path d="M40 -330 Q120 -340 190 -330 L190 -300 Q120 -296 50 -290Z" fill="${t}" ${S(5)}/><path d="M190 -330 l34 6 l-34 20Z" fill="${P1}" ${S(4)}/>`:`<path d="M52 -330 Q96 -250 82 -170 L56 -176 Q62 -250 40 -310Z" fill="${t}" ${S(5)}/>`;
 return `<g transform="translate(${x},${yb}) scale(${s*dir},${s})"><ellipse cx="0" cy="6" rx="110" ry="16" fill="${INK}" opacity=".25"/>${veil}<path d="M-52 -330 Q-96 -250 -82 -170 L-56 -176 Q-62 -250 -40 -310Z" fill="${t}" ${S(5)}/><path d="M-78 0 Q-88 -200 -54 -334 Q-30 -384 0 -388 Q30 -384 54 -334 Q92 -200 82 0Z" fill="${t}" ${S(6)}/><path d="M8 -386 Q30 -384 54 -334 Q92 -200 82 0 L8 0Z" fill="url(#h1)" opacity=".42"/><path d="M-34 -300 Q-46 -150 -40 -8 M-4 -322 Q4 -160 -2 -8 M30 -300 Q48 -150 42 -8" fill="none" ${S(3.5)} opacity=".6"/><path d="M-60 -232 Q0 -214 62 -234" fill="none" ${S(6)}/>${arm}<circle cx="0" cy="-436" r="48" fill="${P1}" ${S(5)}/>${o.veil?`<path d="M-50 -440 Q-52 -498 0 -498 Q52 -498 50 -440 Q28 -476 0 -474 Q-28 -476 -50 -440Z" fill="${o.veil}" ${S(4)}/>`:`<path d="M-50 -438 Q-60 -510 0 -512 Q60 -510 50 -438 Q40 -470 0 -468 Q-40 -470 -50 -438Z" fill="${hair}" ${S(4)}/>${o.beard?`<path d="M-47 -434 Q-52 -372 0 -360 Q52 -372 47 -434 Q30 -406 0 -406 Q-30 -406 -47 -434Z" fill="${hair}" ${S(4)}/>`:''}`}</g>`}
function cross(x,yb,s,op=1){return `<g transform="translate(${x},${yb}) scale(${s})" opacity="${op}"><path d="M-34 0 L-34 -520 L-230 -520 L-230 -588 L-34 -588 L-34 -760 L34 -760 L34 -588 L230 -588 L230 -520 L34 -520 L34 0Z" fill="${P4}" ${S(7)}/><path d="M0 0 L0 -760 L34 -760 L34 -588 L230 -588 L230 -520 L34 -520 L34 0Z" fill="url(#h1)" opacity=".5"/><path d="M-16 -20 V-500 M12 -40 V-740 M-200 -566 H-50 M50 -544 H210 M-10 -600 V-740" fill="none" ${S(3)} opacity=".55"/></g>`}
function roll(x,y,s,open=1,title='',sub='',L=0){const w=380*open;let ln='';for(let i=0;i<9;i++){const yy=-150+i*38;if(Math.abs(yy)<70&&title)continue;ln+=`<path d="M${-w+50} ${yy} H${w-50-R(i)*120*open}" stroke-dasharray="${18+R(i)*30} 10 ${40+R(i*3)*40} 12"/>`}
 return `<g transform="translate(${x},${y}) scale(${s})"><rect x="${-w}" y="-200" width="${2*w}" height="400" fill="url(#gParch)" ${S(6)}/><g fill="none" ${S(4)} opacity="${.45*open}">${ln}</g>${title&&open>.6?`<text x="0" y="14" text-anchor="middle" ${SERIF} font-weight="700" font-size="88" fill="${INK}" opacity="${clamp((open-.6)*3)}">${title}</text>`:''}${sub&&open>.7?`<text x="0" y="74" text-anchor="middle" ${SERIF} font-style="italic" font-size="44" fill="${RED}" opacity="${clamp((open-.7)*4)}">${sub}</text>`:''}${[-1,1].map(k=>`<g transform="translate(${k*w},0)"><rect x="-34" y="-232" width="68" height="464" rx="26" fill="url(#gRoll)" ${S(6)}/><rect x="-16" y="-266" width="32" height="40" rx="10" fill="${P5}" ${S(5)}/><rect x="-16" y="226" width="32" height="40" rx="10" fill="${P5}" ${S(5)}/><path d="M-20 -190 V190 M4 -200 V200" fill="none" ${S(2.5)} opacity=".4"/></g>`).join('')}</g>`}
function book(x,y,s,L=0,head=''){return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="150" rx="470" ry="34" fill="${INK}" opacity=".25"/><path d="M-440 130 L-420 -160 Q-220 -210 0 -150 Q220 -210 420 -160 L440 130 Q220 86 0 140 Q-220 86 -440 130Z" fill="${P5}" ${S(7)}/><path d="M-410 100 L-394 -176 Q-200 -226 0 -166 L0 116 Q-200 62 -410 100Z" fill="url(#gParch)" ${S(5)}/><path d="M410 100 L394 -176 Q200 -226 0 -166 L0 116 Q200 62 410 100Z" fill="url(#gParch)" ${S(5)}/><path d="M0 -166 V116" ${S(5)}/><g fill="none" ${S(3.5)} opacity=".45">${[0,1,2,3,4,5].map(i=>`<path d="M-360 ${-120+i*36} Q-200 ${-164+i*36} -40 ${-112+i*36}" stroke-dasharray="${30+R(i)*40} 9"/><path d="M360 ${-120+i*36} Q200 ${-164+i*36} 40 ${-112+i*36}" stroke-dasharray="${24+R(i+5)*40} 9"/>`).join('')}</g>${head?`<text x="-200" y="-150" text-anchor="middle" ${SERIF} font-weight="700" font-size="46" fill="${RED}" transform="rotate(-7 -200 -150)">${head}</text>`:''}</g>`}
function candle(x,y,s,L){const f=1+Math.sin(L*9)*.06;return `<g transform="translate(${x},${y}) scale(${s})">${glow(0,-250,260,.9)}<rect x="-34" y="-200" width="68" height="200" fill="${P1}" ${S(5)}/><path d="M-34 -150 q14 26 26 0" fill="none" ${S(3)}/><ellipse cx="0" cy="0" rx="70" ry="16" fill="${P4}" ${S(5)}/><path d="M0 -206 q-26 -40 0 -${96*f} q26 ${56*f} 0 ${96*f}Z" fill="#fff3c2" ${S(4,RED)}/></g>`}
function stone(x,y,rx,ry,fill=P3){return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" ${S(5)}/><path d="M${x-rx*.5} ${y-ry*.2} q${rx*.4} ${-ry*.5} ${rx*.9} 0" fill="none" ${S(3)} opacity=".5"/>`}
function star(x,y,r,L){return glow(x,y,r*5,.85)+rays(x,y,16,r*.8,r*4.6,L*.15,.8,GOLD,4)+`<path d="M${x} ${y-r*1.7} L${x+r*.36} ${y-r*.36} L${x+r*1.7} ${y} L${x+r*.36} ${y+r*.36} L${x} ${y+r*1.7} L${x-r*.36} ${y+r*.36} L${x-r*1.7} ${y} L${x-r*.36} ${y-r*.36}Z" fill="#fff6d6" ${S(4)}/>`}
function impact(x,y,r,p){if(p<=0)return '';let s='';for(let i=0;i<14;i++){const a=-Math.PI+i*Math.PI/13,r0=r*(.5+.5*p),r1=r0+70*(1-p*.5)*(i%2?1:.6);s+=`<line x1="${x+Math.cos(a)*r0}" y1="${y+Math.sin(a)*r0*.6}" x2="${x+Math.cos(a)*r1}" y2="${y+Math.sin(a)*r1*.6}"/>`}return `<g ${S(6)} opacity="${clamp(1.6-p*1.2)}">${s}</g>`}

function sheep(x,yb,s,o={}){const c=o.fill||P1;let a='',b='',w='';[[-110,-175,58],[-50,-205,62],[20,-208,64],[85,-190,58],[115,-150,50],[60,-125,56],[-10,-120,58],[-80,-128,56],[-125,-140,48]].forEach(([cx,cy,r])=>{a+=`<circle cx="${cx}" cy="${cy}" r="${r+7}" fill="${INK}"/>`;b+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>`;w+=`<path d="M${cx-18} ${cy} q18 -20 36 0"/>`});

 SC=G.escenas.map(e=>({...e,t0:Math.max(0,at(e.en)-.12)}));SC.forEach((s,i)=>{s.t1=i<SC.length-1?SC[i+1].t0:DUR;['golpe','herida','victoria','luz','pregunta','postes','dintel','sombra'].forEach(k=>{if(Array.isArray(s[k]))s[k]=at(s[k])-s.t0})});
