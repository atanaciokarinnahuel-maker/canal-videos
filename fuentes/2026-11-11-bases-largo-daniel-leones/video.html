<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="mapa.js"></script>
<script src="shots.js"></script>
<script>
/* Daniel: una noche entre leones — motor de render (canvas 1920×1080, 24 fps).
   init(data) carga imágenes y arma la lista de planos; render(t) dibuja el cuadro del segundo t. */
const W=1920,H=1080,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const GOLD='#e3c47a',CREAM='#f1e6cf';
let D,IM={},SH=[],SUBS=[],LA,LB,RC,VIG,STONE,BL={},MAPC,CLOUDS;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,u)=>a+(b-a)*u,ss=u=>{u=clamp(u);return u*u*(3-2*u)};
const ramp=(t,a,b)=>clamp((t-a)/(b-a));
function rng(seed){let s=seed>>>0;return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noise1(x,seed=0){const i=Math.floor(x),f=x-i,h=n=>{const v=Math.sin((n+seed*17.3)*127.1)*43758.5453;return v-Math.floor(v)};return lerp(h(i),h(i+1),f*f*(3-2*f))}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const IMGS={T:'img/T.jpg',P:'img/P.jpg',L:'img/L.jpg',M:'img/M.jpg',K:'img/K.jpg',S:'img/S.jpg',V:'img/V.jpg',O:'img/O.jpg',C:'img/C.jpg'};

/* ---------- recortes: [imagen, x, y, ancho] en fracciones; el alto sale de 16:9 ---------- */
function crop(name){const c=CR[name];if(!c)throw new Error('crop '+name);const im=IM[c[0]];let w=c[3],h=w*im.width*9/16/im.height;
  if(h>1){w/=h;h=1}return{k:c[0],x:clamp(c[1],0,1-w),y:clamp(c[2],0,1-h),w,h}}
function shotRect(s,u){let a=crop(s.a),b;
  if(s.b)b=crop(s.b);else{const z=s.z===undefined?0.07:s.z,f=s.f||[.5,.5],k=1-Math.abs(z),w1=a.w*k,h1=a.h*k;
    b={k:a.k,x:a.x+(a.w-w1)*f[0],y:a.y+(a.h-h1)*f[1],w:w1,h:h1};if(z<0){const t=a;a=b;b=t}}
  const e=u*0.85+ss(u)*0.15,w=a.w*Math.pow(b.w/a.w,e),h=a.h*Math.pow(b.h/a.h,e);
  const cx=lerp(a.x+a.w/2,b.x+b.w/2,e),cy=lerp(a.y+a.h/2,b.y+b.h/2,e);return{k:a.k,x:cx-w/2,y:cy-h/2,w,h}}

/* ---------- efectos de luz ---------- */
const RAYS={L:{k:'L',x:.655,y:.015,ang:17,spread:26,len:.95,n:7},M:{k:'M',x:.265,y:-.05,ang:-4,spread:46,len:1.15,n:9},
  V:{k:'V',x:.02,y:.2,ang:-62,spread:30,len:.9,n:6},S:{k:'S',x:.86,y:.06,ang:52,spread:26,len:.9,n:6}};
function drawRays(c,r,P,t,str){const g=RC.getContext('2d');g.clearRect(0,0,480,270);const im=IM[P.k],asp=im.height/im.width;
  const X=x=>(x-r.x)/r.w*480,Y=y=>(y-r.y)/r.h*270,sx=X(P.x),sy=Y(P.y),un=480/r.w/100; // un = 1% del ancho de la imagen, en px
  for(let i=0;i<P.n;i++){const a=(P.ang+(i/(P.n-1)-.5)*P.spread+Math.sin(t*.23+i*1.7)*1.2)*Math.PI/180;
    const ex=X(P.x+Math.sin(a)*P.len*asp),ey=Y(P.y+Math.cos(a)*P.len),L=Math.hypot(ex-sx,ey-sy),px=-(ey-sy)/L,py=(ex-sx)/L;
    const wn=(.5+.5*noise1(i*3.1))*un,wf=(3+5*noise1(i*7.7+3))*un,al=str*(.35+.65*noise1(t*.35+i*9.1,i))*(.5+.5*noise1(i*5.3));
    const gr=g.createLinearGradient(sx,sy,ex,ey);gr.addColorStop(0,`rgba(255,240,205,${al})`);gr.addColorStop(.55,`rgba(255,236,196,${al*.45})`);gr.addColorStop(1,'rgba(255,236,196,0)');
    g.fillStyle=gr;g.beginPath();g.moveTo(sx+px*wn,sy+py*wn);g.lineTo(ex+px*wf,ey+py*wf);g.lineTo(ex-px*wf,ey-py*wf);g.lineTo(sx-px*wn,sy-py*wn);g.fill()}
  c.save();c.globalCompositeOperation='screen';c.imageSmoothingQuality='high';c.drawImage(RC,0,0,W,H);c.restore()}
function drawDust(c,t,amt,seed){const R=rng(977+seed);c.save();c.globalCompositeOperation='lighter';
  for(let i=0;i<70*amt;i++){const x0=R()*W,y0=R()*H,sp=4+R()*14,ph=R()*6.28,sz=1.2+R()*3.2,a=.05+R()*.2;
    const x=((x0+Math.sin(t*.21+ph)*40+t*sp*.6)%W+W)%W,y=((y0-t*sp+Math.cos(t*.17+ph)*30)%H+H)%H,tw=.5+.5*Math.sin(t*.9+ph*3);
    const g=c.createRadialGradient(x,y,0,x,y,sz*2.4);g.addColorStop(0,`rgba(255,235,200,${a*tw})`);g.addColorStop(1,'rgba(255,235,200,0)');c.fillStyle=g;c.fillRect(x-sz*3,y-sz*3,sz*6,sz*6)}
  c.restore()}
function val(v,u){return Array.isArray(v)?lerp(v[0],v[1],u):v}
function applyFx(c,s,r,u,t){const fx=s.fx||{};
  if(fx.bw!==undefined){c.save();c.globalCompositeOperation='saturation';c.globalAlpha=val(fx.bw,u);c.fillStyle='#808080';c.fillRect(0,0,W,H);c.restore()}
  if(fx.tint==='night'){c.save();c.globalCompositeOperation='multiply';c.fillStyle='rgb(132,150,200)';c.fillRect(0,0,W,H);c.restore()}
  if(fx.tint==='dusk'){c.save();c.globalCompositeOperation='multiply';const k=val([0,1],u);c.fillStyle=`rgb(${255-k*60|0},${255-k*120|0},${255-k*150|0})`;c.fillRect(0,0,W,H);c.restore()}
  if(fx.tint==='dawn'){c.save();c.globalCompositeOperation='soft-light';c.globalAlpha=.5;const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffd9a0');g.addColorStop(1,'#b06a3a');c.fillStyle=g;c.fillRect(0,0,W,H);c.restore()}
  if(fx.dark!==undefined){c.save();c.globalAlpha=clamp(val(fx.dark,ss(u)));c.fillStyle='#000';c.fillRect(0,0,W,H);c.restore()}
  if(fx.flick){const f=fx.flick*(.5*noise1(t*7.3)+.5*noise1(t*13.1,3));c.save();c.globalAlpha=f;c.fillStyle='#000';c.fillRect(0,0,W,H);c.restore()}
  if(fx.close){ // la piedra cubre la entrada: la luz del agujero se apaga y el foso queda a oscuras
    const k=ss(ramp(u,.04,.62)),X=x=>(x-r.x)/r.w*W,Y=y=>(y-r.y)/r.h*H,hx=X(.655),hy=Y(.03),R=.34/r.w*W;
    c.save();const g=c.createRadialGradient(hx,hy,0,hx,hy,R);g.addColorStop(0,`rgba(0,0,0,${k})`);g.addColorStop(.45,`rgba(0,0,0,${k*.95})`);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H);c.restore();
    c.save();c.globalAlpha=.9*ss(ramp(u,.1,.75));c.fillStyle='#000';c.fillRect(0,0,W,H);c.restore()}
  if(fx.rays){const P=RAYS[fx.rays];drawRays(c,r,P,t,val(fx.rs===undefined?.5:fx.rs,u))}
  if(fx.glow){const G=fx.glow,im=IM[r.k],x=(G[0]-r.x)/r.w*W,y=(G[1]-r.y)/r.h*H,R=G[2]/r.w*W*(.9+.1*Math.sin(t*.8)),a=G[3]*ss(ramp(u,.05,.6))*(.85+.15*Math.sin(t*1.3));
    c.save();c.globalCompositeOperation='screen';const g=c.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,`rgba(255,250,235,${a})`);g.addColorStop(.35,`rgba(255,240,205,${a*.5})`);g.addColorStop(1,'rgba(255,235,190,0)');c.fillStyle=g;c.fillRect(0,0,W,H);c.restore()}
  if(fx.dust)drawDust(c,t,fx.dust,s.n||0)}

/* ---------- texto ---------- */
function font(c,spec,ls){c.font=spec;c.letterSpacing=(ls||0)+'px'}
function wrap(c,text,maxW){const ws=text.split(' '),out=[];let l='';for(const w of ws){const t=l?l+' '+w:w;if(c.measureText(t).width>maxW&&l){out.push(l);l=w}else l=t}if(l)out.push(l);return out}
function goldGrad(c,y0,y1){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#fbeab4');g.addColorStop(.5,'#d9ad55');g.addColorStop(1,'#9a6f2a');return g}
function txt(c,s,x,y,a){if(a<=0)return;c.save();c.globalAlpha*=clamp(a);c.fillText(s,x,y);c.restore()}
function shadow(c,b=18,col='rgba(0,0,0,.85)'){c.shadowColor=col;c.shadowBlur=b;c.shadowOffsetY=2}
function ornament(c,x,y,w,a){c.save();c.globalAlpha*=clamp(a);c.strokeStyle=GOLD;c.fillStyle=GOLD;c.lineWidth=2;c.beginPath();c.moveTo(x-w/2,y);c.lineTo(x-14,y);c.moveTo(x+14,y);c.lineTo(x+w/2,y);c.stroke();c.beginPath();c.moveTo(x,y-8);c.lineTo(x+8,y);c.lineTo(x,y+8);c.lineTo(x-8,y);c.closePath();c.fill();c.restore()}

/* ---------- fondos ---------- */
function makeStone(){const c=mk(480,270),g=c.getContext('2d'),R=rng(7);g.fillStyle='#17130f';g.fillRect(0,0,480,270);
  for(let i=0;i<900;i++){const x=R()*480,y=R()*270,r=4+R()*38,v=R();g.fillStyle=v>.5?`rgba(120,98,70,${.03+R()*.05})`:`rgba(0,0,0,${.05+R()*.08})`;g.beginPath();g.ellipse(x,y,r,r*(.4+R()*.8),R()*3,0,7);g.fill()}
  g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1;for(let i=0;i<14;i++){let x=R()*480,y=R()*270;g.beginPath();g.moveTo(x,y);for(let k=0;k<8;k++){x+=(R()-.5)*40;y+=(R()-.3)*26;g.lineTo(x,y)}g.stroke()}
  const d=g.getImageData(0,0,480,270);for(let i=0;i<d.data.length;i+=4){const n=(R()-.5)*14;d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n}g.putImageData(d,0,0);return c}
function drawStone(c,t,u,warm=.5){c.save();c.imageSmoothingQuality='high';const k=1.06+.04*u;c.translate(W/2,H/2);c.scale(k,k);c.drawImage(STONE,-W/2,-H/2,W,H);c.restore();
  const g=c.createRadialGradient(W/2,H*.46,60,W/2,H*.46,1000);const f=.9+.1*noise1(t*5);g.addColorStop(0,`rgba(255,190,110,${.20*warm*f})`);g.addColorStop(.5,`rgba(200,120,60,${.07*warm*f})`);g.addColorStop(1,'rgba(0,0,0,0)');
  c.save();c.globalCompositeOperation='screen';c.fillStyle=g;c.fillRect(0,0,W,H);c.restore()}
function blurBG(name){if(BL[name])return BL[name];const r=crop(name),im=IM[r.k],a=mk(384,216),g=a.getContext('2d');g.filter='blur(7px)';
  g.drawImage(im,r.x*im.width,r.y*im.height,r.w*im.width,r.h*im.height,-12,-7,408,230);return BL[name]=a}
function drawBlur(c,name,u,dark){c.save();c.imageSmoothingQuality='high';const k=1.04+.06*u;c.translate(W/2,H/2);c.scale(k,k);c.drawImage(blurBG(name),-W/2,-H/2,W,H);c.restore();
  c.save();c.globalAlpha=dark;c.fillStyle='#000';c.fillRect(0,0,W,H);c.restore()}
function makeVig(){const c=mk(960,540),g=c.getContext('2d'),gr=g.createRadialGradient(480,262,250,480,270,640);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.7,'rgba(0,0,0,.28)');gr.addColorStop(1,'rgba(0,0,0,.72)');g.fillStyle=gr;g.fillRect(0,0,960,540);return c}

/* ---------- planos de imagen ---------- */
function drawImg(c,s,u,t){const r=shotRect(s,u),im=IM[r.k];c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
  c.drawImage(im,r.x*im.width,r.y*im.height,r.w*im.width,r.h*im.height,0,0,W,H);applyFx(c,s,r,u,t)}

/* ---------- tarjetas ---------- */
function bgOf(c,s,t,u){if(s.bg)drawBlur(c,s.bg,u,s.bgdark===undefined?.62:s.bgdark);else drawStone(c,t,u)}
function drawTitle(c,s,u,t,lt){drawBlur(c,'M_center',u,.5);drawRays(c,{k:'M',x:.25,y:.2,w:.6,h:.679},RAYS.M,t,.35);drawDust(c,t,1,5);
  const a=ramp(lt,.5,1.6);c.save();c.textAlign='center';shadow(c,40);
  font(c,'700 230px Cinzel',34);const word='DANIEL',tw=c.measureText(word).width;c.fillStyle=goldGrad(c,360,560);
  let x=W/2-tw/2+17;c.textAlign='left';for(let i=0;i<word.length;i++){const ch=word[i],cw=c.measureText(ch).width,ai=ramp(lt,.5+i*.16,1.5+i*.16);
    c.save();c.globalAlpha=ss(ai);c.translate(x+cw/2,540);const k=1.12-.12*ss(ai);c.scale(k,k);c.fillText(ch,-cw/2,0);c.restore();x+=cw}
  c.textAlign='center';ornament(c,W/2,618,520*ss(ramp(lt,1.6,2.8)),ramp(lt,1.6,2.4));
  font(c,'400 58px Cinzel',16);c.fillStyle=CREAM;txt(c,'UNA NOCHE ENTRE LEONES',W/2+8,704,ss(ramp(lt,2.1,3.2)));
  font(c,'italic 400 36px "EB Garamond"',1);c.fillStyle=GOLD;txt(c,'Daniel 6  ·  Reina-Valera 1960',W/2,778,ss(ramp(lt,3.0,4.0)));c.restore()}
function drawChapter(c,s,u,t,lt){drawStone(c,t,u);c.save();c.textAlign='center';shadow(c,24);const a=ss(ramp(lt,.35,1.2));
  ornament(c,W/2,440,lerp(60,460,ss(ramp(lt,.3,1.6))),a);
  font(c,'600 86px Cinzel',10);c.fillStyle=CREAM;const lines=wrap(c,s.title.toUpperCase(),1640);
  lines.forEach((l,i)=>txt(c,l,W/2+5,560+i*104,a));
  font(c,'italic 400 50px "EB Garamond"',1);c.fillStyle=GOLD;txt(c,s.ref,W/2,560+lines.length*104-22,ss(ramp(lt,.8,1.7)));c.restore()}
function drawVerse(c,s,u,t,lt,dur){bgOf(c,s,t,u);if(s.rays)drawRays(c,crop(s.bg),RAYS[s.rays],t,.3);drawDust(c,t,.6,9);
  c.save();c.textAlign='center';shadow(c,26);const size=s.size||78;font(c,`italic 500 ${size}px "EB Garamond"`,.5);c.fillStyle=CREAM;
  const lines=wrap(c,s.text,s.maxw||1460),lh=size*1.34,y0=H/2-(lines.length-1)*lh/2-20,sp=s.speed||(Math.min(dur*.6,lines.length*1.5)/lines.length);
  lines.forEach((l,i)=>{const a=ss(ramp(lt,.5+i*sp,1.5+i*sp));c.save();c.translate(0,(1-a)*14);txt(c,l,W/2,y0+i*lh,a);c.restore()});
  const ya=y0+lines.length*lh+6,ar=ss(ramp(lt,.9+lines.length*sp,1.9+lines.length*sp));ornament(c,W/2,ya-18,300,ar);
  font(c,'600 40px Cinzel',6);c.fillStyle=GOLD;txt(c,s.ref,W/2+3,ya+50,ar);c.restore()}
function drawList(c,s,u,t,lt,st){bgOf(c,s,t,u);if(s.rays)drawRays(c,crop(s.bg),RAYS[s.rays],t,val(s.rs||.3,u));drawDust(c,t,.6,3);c.save();c.textAlign='center';shadow(c,26);
  const n=s.items.length,size=s.size||84,lh=size*1.75,y0=H/2-(n-1)*lh/2+10;
  s.items.forEach((it,i)=>{const ti=s.times[i]-st,a=ss(ramp(lt,ti-.1,ti+.8)),big=s.last&&i===n-1;
    let fs=big?size*1.18:size;font(c,`${big?700:500} ${fs}px Cinzel`,big?6:4);const mw=c.measureText(it).width;if(mw>1700){fs*=1700/mw;font(c,`${big?700:500} ${fs}px Cinzel`,big?6:4)}c.fillStyle=big?goldGrad(c,y0+i*lh-60,y0+i*lh+10):CREAM;
    const dim=s.fade&&!big?lerp(1,.5,ss(ramp(lt,s.times[n-1]-st-.2,s.times[n-1]-st+1))):1;
    c.save();c.translate(0,(1-a)*16);txt(c,it,W/2+2,y0+i*lh,a*dim);c.restore()});
  if(s.ref){font(c,'italic 400 48px "EB Garamond"',1);c.fillStyle=GOLD;txt(c,s.ref,W/2,y0+n*lh-30,ss(ramp(lt,s.times[n-1]-st+.6,s.times[n-1]-st+1.6)))}c.restore()}
function drawDecree(c,s,u,t,lt,dur){drawStone(c,t,u,.7);c.save();c.textAlign='center';
  const cols=10,gx=92,gy=118,x0=W/2-(cols-1)*gx/2,y0=250;c.lineCap='round';
  for(let i=0;i<30;i++){const a=ss(ramp(lt,.5+i*.105,.8+i*.105)),x=x0+(i%cols)*gx,y=y0+Math.floor(i/cols)*gy;if(a<=0)continue;
    c.save();c.globalAlpha=a;c.translate(x,y);c.fillStyle='rgba(0,0,0,.6)';c.strokeStyle='#d9ad55';c.lineWidth=3;
    c.beginPath();c.moveTo(-13,-34);c.lineTo(13,-34);c.lineTo(3,34);c.lineTo(-3,34);c.closePath();c.fill();c.stroke();c.restore()}
  shadow(c,24);const a2=ss(ramp(lt,3.4,4.4));font(c,'700 150px Cinzel',16);c.fillStyle=goldGrad(c,640,760);txt(c,'30 DÍAS',W/2+8,760,a2);
  font(c,'600 40px Cinzel',6);c.fillStyle=GOLD;txt(c,'DANIEL 6:7',W/2+3,846,ss(ramp(lt,4.2,5.2)));c.restore()}
function drawEnd(c,s,u,t,lt){drawStone(c,t,u,.8);drawDust(c,t,.6,11);c.save();c.textAlign='center';shadow(c,26);
  const q=s.tq-s.t0,f=s.tf-s.t0,aQ=ss(ramp(lt,q-.2,q+1))*(1-ss(ramp(lt,f+.4,f+1.4))),aT=ss(ramp(lt,.3,1.5));
  font(c,'700 104px Cinzel',14);c.fillStyle=goldGrad(c,250,340);const yT=lerp(330,330,0);txt(c,'BASES BÍBLICAS',W/2+7,yT,aT);
  ornament(c,W/2,392,lerp(80,560,ss(ramp(lt,.6,2))),aT);
  font(c,'italic 400 44px "EB Garamond"',1);c.fillStyle=CREAM;txt(c,'La Palabra de Dios por encima de toda opinión humana',W/2,462,ss(ramp(lt,1.2,2.4)));
  font(c,'500 60px "EB Garamond"',.5);c.fillStyle=CREAM;['¿Habrías tenido el valor de Daniel para seguir orando,','aun sabiendo que podías morir?'].forEach((l,i)=>txt(c,l,W/2,650+i*84,aQ));
  font(c,'600 32px Cinzel',5);c.fillStyle=GOLD;txt(c,'RESPONDÉ EN LOS COMENTARIOS',W/2+2,838,aQ*ss(ramp(lt,q+1,q+2)));
  const aR=ss(ramp(lt,f+1.2,f+2.4));font(c,'600 40px Cinzel',6);c.fillStyle=GOLD;txt(c,'SUSCRIBITE  ·  HASTA EL PRÓXIMO ESTUDIO',W/2+3,668,aR);
  font(c,'italic 400 38px "EB Garamond"',1);c.fillStyle=CREAM;txt(c,'Texto bíblico: Daniel 6:1-28  ·  Biblia Reina-Valera 1960',W/2,760,aR);c.restore()}

/* ---------- cielo: noche → amanecer sobre el palacio ---------- */
function mix(a,b,u){return a.map((v,i)=>Math.round(lerp(v,b[i],u)))}
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
function makeClouds(){const c=mk(960,270),g=c.getContext('2d'),R=rng(31);g.filter='blur(14px)';for(let i=0;i<26;i++){g.fillStyle=`rgba(255,255,255,${.10+R()*.16})`;g.beginPath();g.ellipse(R()*960,60+R()*170,60+R()*150,8+R()*20,0,0,7);g.fill()}return c}
function palace(c,col){ // silueta: torre almenada, cipreses, escalinata y sala de columnas (apadana) con almenas escalonadas
  c.fillStyle=col;const base=846;
  c.beginPath();c.moveTo(0,H);c.lineTo(0,base-40);c.lineTo(110,base-40);c.lineTo(110,486);
  for(let i=0;i<5;i++){const x=110+i*44;c.lineTo(x,462);c.lineTo(x+11,462);c.lineTo(x+11,448);c.lineTo(x+33,448);c.lineTo(x+33,462);c.lineTo(x+44,462)}
  c.lineTo(330,486);c.lineTo(330,base-40);c.lineTo(470,base-40);
