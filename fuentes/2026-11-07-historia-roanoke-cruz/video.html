<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:TW;src:url(../2026-11-07-historia-largo-roanoke/assets/typewriter.woff2)}
@font-face{font-family:Fell;src:url(../2026-11-07-historia-largo-roanoke/assets/fell.woff2)}
@font-face{font-family:Fell;font-style:italic;src:url(../2026-11-07-historia-largo-roanoke/assets/fell-italic.woff2)}
@font-face{font-family:Gar;src:url(../2026-11-07-historia-largo-roanoke/assets/garamond.woff2)}
@font-face{font-family:Gar;font-weight:700;src:url(../2026-11-07-historia-largo-roanoke/assets/garamond-bold.woff2)}
:root{--ink:#2b1d12;--sepia:#6b4a2b;--red:#8e2a1e;--paper:#eadcc0;--cream:#f4e8cf}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a120b}
#paper{position:absolute;inset:0;background:url(../2026-11-07-historia-largo-roanoke/assets/papel.jpg) center/cover}
#stage{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
svg{position:absolute;left:0;top:0;overflow:visible}
.tw{font-family:TW;letter-spacing:2px}
.fell{font-family:Fell}
.gar{font-family:Gar}
.dark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,#3a2a1b 0%,#1d140c 60%,#120b06 100%)}
.tag{position:absolute;font-family:TW;font-size:38px;color:var(--ink);background:#efe3c8;padding:10px 24px;box-shadow:3px 5px 12px rgba(30,18,8,.45);white-space:nowrap}
.tag.d{background:#2b1d12;color:#f2e6cc}
.stamp{position:absolute;font-family:TW;font-size:74px;color:#b8342a;border:9px solid #b8342a;padding:8px 30px;border-radius:12px;letter-spacing:5px;white-space:nowrap;background:rgba(240,225,195,.06)}
.stamp.s{font-size:54px;border-width:7px}
.photo{position:absolute;background:#f4ead6;padding:20px 20px 62px;box-shadow:8px 16px 40px rgba(10,5,0,.65)}
.photo .win{position:relative;overflow:hidden;width:100%;height:100%;background:#000}
.photo .win img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.photo .cap{position:absolute;left:24px;bottom:14px;font-family:TW;font-size:28px;color:#5a4330}
.tape{position:absolute;width:170px;height:48px;background:rgba(222,205,160,.78);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.big{position:absolute;left:0;right:0;text-align:center;font-family:Fell;color:var(--cream);text-shadow:0 4px 18px rgba(0,0,0,.6)}
.bigi{position:absolute;left:0;right:0;text-align:center;font-family:Fell;color:var(--ink)}
.card{position:absolute;background:#f1e6cd;box-shadow:6px 12px 30px rgba(20,10,0,.5);padding:38px 44px;border:1px solid #c9b48e}
.card .k{font-family:TW;font-size:34px;letter-spacing:4px;color:var(--red)}
.card .h{font-family:Fell;font-size:84px;line-height:1.05;margin-top:12px;color:var(--ink)}
.card .b{font-family:Gar;font-size:50px;line-height:1.22;margin-top:16px;color:#3a2a1c}
.card.hip{border-top:16px solid #9a6a1d}.card.hip .k{color:#9a6a1d}
.card.hecho{border-top:16px solid #3f5a3a}.card.hecho .k{color:#3f5a3a}
/* capas fijas */
#dust{position:absolute;inset:0;pointer-events:none}
.mote{position:absolute;border-radius:50%;background:rgba(255,238,200,.9)}
#leak{position:absolute;inset:0;background:radial-gradient(ellipse at 90% 8%,rgba(255,200,120,.32),rgba(255,200,120,0) 55%);mix-blend-mode:screen;pointer-events:none}
#grain{position:absolute;left:-256px;top:-256px;width:1592px;height:2432px;background:url(grain.png);opacity:.16;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 50%,rgba(25,14,5,.45) 80%,rgba(12,6,2,.85) 100%)}
#flash{position:absolute;inset:0;background:#fff4dc;opacity:0;pointer-events:none}
/* tabla de progreso: letras que se tallan */
#plank{position:absolute;left:50px;top:112px;width:980px;height:132px;border-radius:10px;
 background:linear-gradient(180deg,#9b7a52 0%,#8a6943 45%,#7a5a37 100%);box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,230,190,.35),inset 0 -3px 0 rgba(0,0,0,.35)}
#plank .grain{position:absolute;inset:0;border-radius:10px;opacity:.5}
#plank .L{position:absolute;top:14px;width:92px;height:104px;text-align:center;font-family:Fell;font-size:96px;line-height:104px;color:#3a2410}
#plank .ghost{color:rgba(50,30,12,.16)}
#plank .nail{position:absolute;top:56px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9d0c0,#5b5248);box-shadow:0 1px 2px #000}
#slot{position:absolute;left:820px;top:12px;width:130px;height:108px;border:5px dashed rgba(244,232,207,.85);border-radius:10px;text-align:center;font-family:Fell;font-size:84px;line-height:98px;color:#f4e8cf}
#sstamp{position:absolute;left:770px;top:22px;font-family:TW;font-size:40px;color:#c43a2c;border:6px solid #c43a2c;border-radius:8px;padding:2px 12px;background:rgba(240,225,195,.92);white-space:nowrap}
#under{position:absolute;left:60px;right:60px;top:258px;height:40px;font-family:TW;font-size:27px;color:rgba(244,232,207,.85);letter-spacing:3px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
#under .r{position:absolute;right:0;top:0}
/* subtítulos */
#sub{position:absolute;left:60px;right:60px;top:1342px;text-align:center}
#sub .box{display:inline-block;max-width:960px;background:rgba(22,13,6,.78);border-radius:16px;padding:16px 26px 22px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#sub .w{display:inline-block;font-family:Gar;font-weight:700;font-size:70px;line-height:1.12;color:#f6ead2;margin:0 7px;padding:0 8px;border-radius:10px}
#sub .w.f{opacity:.38}
#sub .w.a{background:#9a2e22;color:#fff6e4}
</style></head>
<body>
<div id="paper"></div>
<div id="stage"></div>
<div id="dust"></div>
<div id="leak"></div>
<div id="grain"></div>
<div id="vig"></div>
<div id="under"><span>HistorIAs del mundo</span><span class="r">ROANOKE · 1590</span></div>
<div id="plank"></div>
<div id="sub"></div>
<div id="flash"></div>
<script>
let D,TEMPO,SC=[],IMG='../2026-11-07-historia-largo-roanoke/assets/';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const R=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const O=x=>x/TEMPO;               // tiempo original de la voz -> tiempo del video
function W(txt,n=0){let k=0;for(const w of D.words){if(w.t.startsWith(txt)){if(k===n)return w.s;k++}}return null}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
// ---------- piezas ----------
function photo(src,cap,x,y,w,h,rot,z,px,py,extra=''){
  return `<div class="photo" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)">
  <div class="win"><img src="${IMG}${src}" style="transform:scale(${z}) translate(${px}px,${py}px)">${extra}</div><div class="cap">${cap}</div>
  <div class="tape" style="left:${w/2-85}px;top:-22px;transform:rotate(${-rot*1.5}deg)"></div></div>`}
function stamp(txt,x,y,lt,t0,cls='',rot=-7){const p=R(lt,t0,t0+.22);if(p<=0)return '';
  const s=1+(1-eo(p))*1.6;return `<div class="stamp ${cls}" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s});opacity:${p}">${txt}</div>`+burst(x,y,lt-t0)}
function burst(x,y,dt){if(dt<0||dt>.9)return '';let s='';for(let i=0;i<16;i++){const a=rnd(i)*6.28,v=180+rnd(i+9)*260,d=dt*v;
  s+=`<div class="mote" style="left:${x+Math.cos(a)*d*1.6}px;top:${y+Math.sin(a)*d*.8+dt*dt*200}px;width:${6+rnd(i+3)*8}px;height:${6+rnd(i+3)*8}px;opacity:${(1-dt/.9)*.8};background:#d8c3a0"></div>`}return s}
function typed(txt,lt,t0,cps=18){const n=Math.floor(cl((lt-t0)*cps,0,txt.length));return txt.slice(0,n)+(n<txt.length&&lt>t0?'<span style="opacity:.6">▌</span>':'')}
function kin(txt,lt,t0,step=.035){let s='';[...txt].forEach((c,i)=>{const p=eo(R(lt,t0+i*step,t0+i*step+.3));
  s+=`<span style="display:inline-block;opacity:${p};transform:translateY(${(1-p)*40}px) scale(${.7+.3*p})">${c===' '?'&nbsp;':c}</span>`});return s}
function people(n,cols,x0,y0,dx,dy,vis){let s='';for(let i=0;i<n;i++){const v=vis(i);if(v<=0)continue;const x=x0+(i%cols)*dx,y=y0+Math.floor(i/cols)*dy;
  s+=`<g transform="translate(${x},${y}) scale(${.6+.4*v})" opacity="${v}" fill="#2b1d12"><circle cx="0" cy="-58" r="17"/><path d="M-24,0 Q-24,-34 0,-36 Q24,-34 24,0 L18,0 L16,36 L4,36 L0,8 L-4,36 L-16,36 L-18,0 Z"/></g>`}return s}
function sea(lt,col='#9fa48c',op=.6){let s='';for(let y=320;y<1340;y+=60){const o=(lt*30+y)%120;s+=`<path d="M${-120+o},${y} q60,-14 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0" stroke="${col}" stroke-width="3" fill="none" opacity="${op}"/>`}return s}
// mapa de las Outer Banks (vertical)
function mapOB(lt,reveal,hiC,route){
  const land='#cdb48a',edge='#3b2a1a';
  let s=`<svg width="1080" height="1920"><defs><clipPath id="rv"><circle cx="600" cy="640" r="${reveal*1100}"/></clipPath>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="14" stroke="#8a6c45" stroke-width="2" opacity=".45"/></pattern></defs>
  <g clip-path="url(#rv)" transform="translate(0,300)">${sea(lt)}
  <path d="M-10,0 L520,0 Q560,120 500,200 Q470,260 520,330 Q560,420 470,480 Q430,560 480,640 Q520,720 420,800 Q330,880 300,1010 L-10,1010 Z" fill="${land}" stroke="${edge}" stroke-width="5"/>
  <path d="M-10,0 L520,0 Q560,120 500,200 Q470,260 520,330 Q560,420 470,480 Q430,560 480,640 Q520,720 420,800 Q330,880 300,1010 L-10,1010 Z" fill="url(#hatch)"/>
  <path d="M760,0 Q800,250 860,500 Q900,640 905,700 Q880,760 760,860 Q660,940 560,1010 L536,995 Q650,915 745,840 Q860,745 878,700 Q870,640 834,505 Q775,255 734,0 Z" fill="${land}" stroke="${edge}" stroke-width="4"/>
  <ellipse cx="610" cy="330" rx="26" ry="72" fill="${land}" stroke="${edge}" stroke-width="4"/>
  ${hiC>0?`<path d="M868,560 Q905,660 900,705 Q875,770 770,850" stroke="#b8342a" stroke-width="${16*hiC}" fill="none" opacity="${.85*hiC}" stroke-linecap="round"/>`:''}
  ${route>0?`<path d="M630,350 Q760,520 860,690" stroke="#b8342a" stroke-width="7" fill="none" stroke-dasharray="20 14" pathLength="1000" stroke-dashoffset="0" style="stroke-dasharray:${route*1000} 1000"/>`:''}
  <text x="70" y="620" font-family="TW" font-size="34" fill="#3b2a1a" letter-spacing="3">CAROLINA</text><text x="70" y="662" font-family="TW" font-size="34" fill="#3b2a1a" letter-spacing="3">DEL NORTE (hoy)</text>
  <text x="1010" y="320" font-family="TW" font-size="34" fill="#4a5a5a" letter-spacing="8" transform="rotate(90 1010 320)">OCÉANO ATLÁNTICO</text>
  <g transform="translate(150,90)" stroke="#3b2a1a" fill="none" stroke-width="3"><circle r="44"/><path d="M0,-58 L10,0 L0,58 L-10,0 Z" fill="#3b2a1a"/><text x="-10" y="-66" font-family="TW" font-size="28" fill="#3b2a1a" stroke="none">N</text></g>
  </g></svg>`;return s}
// tronco y poste
function trunk(lt){let bark='';for(let i=0;i<16;i++){const x=300+i*32;bark+=`<path d="M${x},280 Q${x+18+(i%3)*8},800 ${x-10},1320" stroke="#2a1c10" stroke-width="${3+(i%4)}" fill="none" opacity=".55"/>`}
  return `<svg width="1080" height="1920"><path d="M260,280 Q300,800 230,1320 L870,1320 Q800,800 840,280 Z" fill="#6e5639"/>${bark}
  <ellipse cx="550" cy="760" rx="220" ry="230" fill="#c5a67a" opacity=".9"/><ellipse cx="550" cy="760" rx="220" ry="230" fill="none" stroke="#4a3622" stroke-width="10"/></svg>`}
function stakes(lt){let s='';for(let i=0;i<9;i++){const x=-40+i*130,h=880+((i*53)%120);
  s+=`<path d="M${x},1330 L${x},${1330-h} L${x+60},${1330-h-70} L${x+120},${1330-h} L${x+120},1330 Z" fill="${i%2?'#4a3a28':'#5a4630'}" stroke="#20160c" stroke-width="4"/>`+
  `<path d="M${x+40},${1330-h+40} Q${x+55},${1330-h/2} ${x+38},1320" stroke="#2c2014" stroke-width="3" fill="none" opacity=".6"/>`}
  return `<svg width="1080" height="1920">${s}<rect x="-20" y="620" width="1120" height="40" fill="#3a2c1e"/></svg>`}
function carved(txt,cls,fs){return `<span style="font-family:Fell;font-size:${fs}px;color:#2a1808;text-shadow:0 3px 0 rgba(255,225,180,.35),0 -2px 3px rgba(0,0,0,.7)">${txt}</span>`}
function ship(x,y,s,rot,col='#1f150c'){return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})" fill="${col}"><path d="M-90,0 L90,0 L66,34 L-70,34 Z"/><rect x="-4" y="-150" width="8" height="150"/><rect x="-54" y="-120" width="5" height="120"/><rect x="46" y="-110" width="5" height="110"/>
 <path d="M-50,-140 Q0,-150 50,-140 L46,-40 Q0,-50 -46,-40 Z" opacity=".92"/><path d="M-90,-100 Q-70,-106 -56,-100 L-58,-30 Q-74,-36 -90,-30Z" opacity=".9"/><path d="M52,-96 Q70,-102 88,-96 L86,-30 Q70,-36 54,-30Z" opacity=".9"/><path d="M4,-168 L40,-158 L4,-148Z"/></g>`}
function cross(x,y,s,op,col,dash){return `<svg width="1080" height="1920"><g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><path d="M-30,-150 L30,-150 L30,-50 L130,-50 L130,10 L30,10 L30,190 L-30,190 L-30,10 L-130,10 L-130,-50 L-30,-50 Z" fill="${dash?'none':col}" stroke="${col}" stroke-width="10" ${dash?'stroke-dasharray="26 18"':''}/></g></svg>`}

// ---------- escenas (inicio en segundos ORIGINALES de la voz) ----------
const S=[
['hook',0],['nadie',2.0],['cien',4.6],['desap',6.5],['pista',7.85],['falta',10.25],['map1',12.7],['map2',14.95],['white',16.45],['atl',18.7],
['senal',21.0],['rule1',23.35],['rule2',25.2],['rule2b',26.45],['war',27.95],['anos',29.4],['fecha',30.8],['casas',32.55],['arbol',34.6],['cro',36.65],['poste',38.65],['croatoan',40.55],
['mapc',41.95],['mapc2',43.25],['grabado',44.65],['nocruz',47.1],['salvo',48.95],['storm',51.05],['nunca',53.45],['preg',54.65],['doc',55.95],['sigue',58.25]];
const F={
hook(lt,d){const z=1.04+lt*.06;return `<div class="dark"></div>${photo('09.jpg','Ilustración',70,330,940,640,-2,z,-lt*10,0)}
  <div class="tag d" style="left:110px;top:300px;transform:rotate(-3deg)">${typed('18 · AGO · 1590',lt,.05,14)}</div>
  <div class="big" style="top:1035px;font-size:150px">${kin('Volvió…',lt,.05,.05)}</div>
  <div class="big" style="top:1205px;font-size:60px;font-style:italic;color:#e5cfa5">${kin('el día del cumpleaños de su nieta',lt,O(1.0)-0.1,.018)}</div>`},
nadie(lt,d){const t0=W('nadie.')-O(2.0)+0.0;return `<div class="dark"></div>
  <div class="abs" style="left:-60px;top:300px;width:1200px;height:1000px;overflow:hidden;-webkit-mask-image:radial-gradient(ellipse,#000 45%,transparent 72%)"><img src="${IMG}05.jpg" style="width:1200px;height:1000px;object-fit:cover;filter:blur(5px) brightness(.55) sepia(.4);transform:scale(${1.1+lt*.04})"></div>
  <div class="big" style="top:520px;font-size:96px">${kin('y no quedaba',lt,.0,.03)}</div>
  ${stamp('NADIE',540,830,lt,t0-.1,'',-6)}
  <div class="tag" style="left:330px;top:1080px;opacity:${R(lt,t0+.3,t0+.6)}">ni una sola persona</div>`},
cien(lt,d){const t0=W('cien')-O(4.6);const n=Math.round(cl(R(lt,.1,t0+.6))*100);return `
  <div class="bigi" style="top:320px;font-size:66px;font-family:TW;letter-spacing:6px">COLONOS · 1587</div>
  <div class="bigi" style="top:400px;font-size:230px;color:#8e2a1e">+${n}</div>
  <svg width="1080" height="1920">${people(40,8,145,830,113,120,i=>eo(R(lt,.1+i*.035,.4+i*.035)))}</svg>
  <div class="tag" style="left:200px;top:1240px;opacity:${R(lt,.6,.9)}">hombres, mujeres y niños</div>`},
desap(lt,d){const t0=W('desaparecidas.')-O(6.5);return `
  <div class="bigi" style="top:320px;font-size:66px;font-family:TW;letter-spacing:6px">COLONOS · 1587</div>
  <div class="bigi" style="top:400px;font-size:230px;color:#8e2a1e;opacity:${1-R(lt,.2,1)*.7}">+100</div>
  <svg width="1080" height="1920">${people(40,8,145,830,113,120,i=>1-R(lt,rnd(i)*1.0,rnd(i)*1.0+.3))}</svg>
  ${stamp('DESAPARECIDAS',540,1000,lt,Math.max(.15,t0),'',-5)}`},
pista(lt,d){let lines='';for(let i=0;i<9;i++)lines+=`<path d="M170,${740+i*58} q${120+rnd(i)*80},-8 ${260+rnd(i+2)*200},0 t${200+rnd(i+4)*100},0" stroke="#5a4330" stroke-width="5" fill="none" opacity=".55"/>`;
  const lx=330+Math.sin(lt*2.2)*170,ly=900+Math.cos(lt*1.7)*90;return `
  <div class="card" style="left:110px;top:640px;width:860px;height:600px;transform:rotate(1.5deg)"></div>
  <svg width="1080" height="1920">${lines}<g transform="translate(${lx},${ly})"><circle r="130" fill="rgba(255,250,235,.25)" stroke="#2b1d12" stroke-width="16"/><path d="M92,92 L200,200" stroke="#2b1d12" stroke-width="34" stroke-linecap="round"/></g></svg>
  <div class="bigi" style="top:330px;font-size:92px;line-height:1.05;color:var(--cream);text-shadow:0 4px 16px rgba(0,0,0,.7)">${kin('La pista',lt,.0,.04)}<br>${kin('más importante…',lt,.35,.03)}</div>`},
falta(lt,d){const t1=W('sino')-O(10.25);const pul=1+.06*Math.sin(lt*9);return `<div class="dark"></div>
  <div class="big" style="top:330px;font-size:64px;color:#cdb48a">${kin('no fue lo que encontró…',lt,.0,.02)}</div>
  <svg width="1080" height="1920"><rect x="290" y="560" width="500" height="500" rx="20" fill="none" stroke="#f4e8cf" stroke-width="9" stroke-dasharray="40 26" stroke-dashoffset="${-lt*120}"/></svg>
  <div class="big" style="top:640px;font-size:300px;transform:scale(${pul})">?</div>
  <div class="big" style="top:1110px;font-size:92px;color:#f0b49a">${kin('…sino lo que FALTABA',lt,t1,.03)}</div>
  <svg width="1080" height="1920" style="opacity:${R(lt,t1+.5,t1+.8)}"><path d="M885,${520-Math.sin(lt*8)*14} L885,330" stroke="#f4e8cf" stroke-width="8" stroke-dasharray="16 12"/><path d="M860,${355} L885,${320} L910,${355}" stroke="#f4e8cf" stroke-width="8" fill="none"/></svg>`},
map1(lt,d){return mapOB(lt,eio(R(lt,0,1.3)),0,0)+`<div class="tag d" style="left:90px;top:340px;transform:rotate(-2deg)">${typed('1587',lt,.1,10)}</div>
  <div class="tag" style="left:560px;top:${560+R(lt,.9,1.4)*0}px;opacity:${R(lt,1.0,1.3)}">ISLA DE ROANOKE</div>
