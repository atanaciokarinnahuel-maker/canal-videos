 else if(m==='up'){aL=150+Math.sin(T*16)*12;aR=-150-Math.sin(T*16)*12}else if(m==='mouth'){aL=-112;aR=112}else if(m==='point'){aR=-120}else if(m==='think'){aR=125;aL=Math.sin(T*3)*5}

 ['eL','eR'].forEach((id,k)=>{const cx=k?242:158;sv.querySelector('#'+id).setAttribute('transform',`translate(${cx} 240) scale(${shock?1.25:1} ${shock?1.25:blink}) translate(${-cx} -240)`)});
 const talk=speaking(T)&&m!=='mouth'&&m!=='eyes';const mo=sv.querySelector('#mo');mo.setAttribute('ry',shock?24:talk?6+Math.abs(Math.sin(T*24))*14:0);sv.querySelector('#mouth').setAttribute('opacity',(shock||talk)?0:1);
 sv.querySelector('#ant').setAttribute('transform',`rotate(${Math.sin(T*5)*10} 200 118)`);
