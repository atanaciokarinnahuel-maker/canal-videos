<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0f3b47}
#stage{position:absolute;inset:0;overflow:hidden;transform-origin:540px 960px}
.L{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.L svg{position:absolute;left:0;top:0;overflow:visible}
#cv{position:absolute;left:0;top:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(0,0,0,0) 58%,rgba(8,40,50,.45) 100%)}
.kt{position:absolute;left:30px;right:30px;text-align:center;font-family:'Inter Display','Inter';font-weight:900;line-height:.98;letter-spacing:-1px;color:#fff;-webkit-text-stroke:16px #0f3b47;paint-order:stroke fill;text-shadow:0 10px 0 #0f3b47;transform-origin:50% 50%;display:none}
.kt .g{color:#f7b32b}.kt .r{color:#ff6f59}.kt .t{color:#5ee3d6}.kt .o{color:#ffa94d}
.tag{display:inline-block;padding:14px 34px;border-radius:50px;background:#fff;color:#0f3b47;border:7px solid #0f3b47;box-shadow:0 9px 0 #0f3b47;-webkit-text-stroke:0;text-shadow:none;font-size:44px;letter-spacing:0}
.tag.gold{background:#f7b32b}.tag.teal{background:#5ee3d6}.tag.coral{background:#ff8f7d}
#subs{position:absolute;left:40px;right:40px;top:1405px;height:150px;text-align:center;font-family:'Inter Display','Inter';font-weight:900;font-size:64px;line-height:1.08}
#subs span{display:inline-block;margin:0 13px;color:#fff;-webkit-text-stroke:12px #0f3b47;paint-order:stroke fill;transform-origin:50% 70%}
#subs span.on{color:#f7b32b}
#prog{position:absolute;left:0;top:0;width:1080px;height:260px}
#chip{position:absolute;left:60px;top:214px;padding:10px 26px;border-radius:40px;background:rgba(255,255,255,.95);color:#0f3b47;border:5px solid #0f3b47;font-family:'Inter Display';font-weight:900;font-size:36px;white-space:nowrap;transform-origin:0 50%}
#chip b{color:#d9480f}
#flash{position:absolute;inset:0;background:#fffbe8;opacity:0}
#edge{position:absolute;top:0;width:60px;height:1920px;background:linear-gradient(90deg,rgba(247,179,43,0),#fff3c4,rgba(247,179,43,0));display:none}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
<defs>
 <linearGradient id="skyOasis" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a9db0"/><stop offset=".42" stop-color="#7fd6d0"/><stop offset=".72" stop-color="#ffe1b0"/><stop offset="1" stop-color="#ffc58f"/></linearGradient>
 <linearGradient id="skyMorning" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb3bf"/><stop offset=".45" stop-color="#ffd59e"/><stop offset=".8" stop-color="#ff9a76"/></linearGradient>
 <linearGradient id="skyDim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16424f"/><stop offset=".55" stop-color="#2f6b78"/><stop offset="1" stop-color="#6f9c98"/></linearGradient>
 <linearGradient id="skyCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f6e7a"/><stop offset=".55" stop-color="#3fc1c9"/><stop offset="1" stop-color="#bff0d8"/></linearGradient>
 <linearGradient id="skyCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset=".6" stop-color="#ffb26b"/><stop offset="1" stop-color="#ffe7a8"/></linearGradient>
 <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a65"/><stop offset=".5" stop-color="#ffc46b"/><stop offset="1" stop-color="#fff1c9"/></linearGradient>
 <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10243a"/><stop offset=".6" stop-color="#2b4f6e"/><stop offset="1" stop-color="#6aa0b0"/></linearGradient>
 <linearGradient id="skySage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e7d6b"/><stop offset=".6" stop-color="#8cb369"/><stop offset="1" stop-color="#f4e285"/></linearGradient>
 <radialGradient id="gSun"><stop offset="0" stop-color="#fffbe8"/><stop offset=".35" stop-color="#ffe08a"/><stop offset=".6" stop-color="#ffc06b" stop-opacity=".55"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/></radialGradient>
 <radialGradient id="gGlow"><stop offset="0" stop-color="#fff6d5" stop-opacity=".95"/><stop offset="1" stop-color="#f7b32b" stop-opacity="0"/></radialGradient>
 <radialGradient id="gFire"><stop offset="0" stop-color="#fff2b0"/><stop offset=".4" stop-color="#ffab3d" stop-opacity=".8"/><stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/></radialGradient>
 <radialGradient id="gIron" cx=".35" cy=".3"><stop offset="0" stop-color="#9fb4bd"/><stop offset=".5" stop-color="#4d6670"/><stop offset="1" stop-color="#1f343c"/></radialGradient>
 <radialGradient id="gCoin" cx=".35" cy=".3"><stop offset="0" stop-color="#fff6c0"/><stop offset=".5" stop-color="#f7c844"/><stop offset="1" stop-color="#c98614"/></radialGradient>
 <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#f7b32b"/><stop offset="1" stop-color="#d9861a"/></linearGradient>
 <linearGradient id="gSand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d7a0"/><stop offset="1" stop-color="#e2b277"/></linearGradient>
 <linearGradient id="gSand2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9be82"/><stop offset="1" stop-color="#c9935a"/></linearGradient>
 <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8cf6f"/><stop offset="1" stop-color="#6f9c4a"/></linearGradient>
 <linearGradient id="gParch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6df"/><stop offset="1" stop-color="#f3dcae"/></linearGradient>
 <linearGradient id="gShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f3b47" stop-opacity="0"/><stop offset="1" stop-color="#0f3b47" stop-opacity=".35"/></linearGradient>
 <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ee3d6"/><stop offset="1" stop-color="#2a9db0"/></linearGradient>
 <filter id="fb3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="fb6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="fb12" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
</defs></svg>
<div id="stage">
 <div id="LA" class="L"></div>
 <div id="LB" class="L"></div>
 <div id="edge"></div>
 <div id="vig"></div>
 <canvas id="cv" width="1080" height="1920"></canvas>
 <div id="kts"></div>
 <div id="subs"></div>
 <svg id="prog" width="1080" height="260" viewBox="0 0 1080 260"></svg>
 <div id="chip"></div>
 <div id="flash"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const elastic=t=>{t=clamp(t);if(t===0||t===1)return t;return Math.pow(2,-9*t)*Math.sin((t*9-.75)*2*Math.PI/3)+1};
const $=id=>document.getElementById(id);
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const P=(L,a,d)=>clamp((L-a)/d);
function kf(T,a,ease=eio){if(T<=a[0][0])return a[0].slice(1);for(let i=1;i<a.length;i++){if(T<=a[i][0]){const d=a[i][0]-a[i-1][0];const u=d<=0?1:ease((T-a[i-1][0])/d);return a[i].slice(1).map((v,k)=>lerp(a[i-1][k+1],v,u))}}return a[a.length-1].slice(1)}
function hex(c){return [1,3,5].map(i=>parseInt(c.substr(i,2),16))}
function shade(c,f){const A=hex(c);return '#'+A.map(v=>Math.round(clamp(f<0?v*(1+f):v+(255-v)*f,0,255)).toString(16).padStart(2,'0')).join('')}
const INK='#0f3b47',GOLD='#f7b32b',CORAL='#ff6f59',AQUA='#3fc1c9',SAGE='#8cb369';
let W=[],VOICE=0,DUR=0,GROUPS=[];
const F=`font-family="Inter Display" font-weight="900"`;
const TX=(x,y,t,fs,col='#fff',st=INK,sw=10,anc='middle')=>`<text x="${x}" y="${y}" text-anchor="${anc}" ${F} font-size="${fs}" fill="${col}" stroke="${st}" stroke-width="${sw}" paint-order="stroke fill">${t}</text>`;
/* ===================== piezas ===================== */
const sky=id=>`<rect x="-300" y="-300" width="1680" height="2520" fill="url(#${id})"/>`;
function sun(x,y,r,op=1){return `<circle cx="${x}" cy="${y}" r="${r*3.2}" fill="url(#gSun)" opacity="${.75*op}"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff4d0" opacity="${op}"/>`}
function rays(x,y,n,len,rot,op,col='#fff8dc',wd=.07){let s='';for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;s+=`<path d="M${x} ${y} L${x+Math.cos(a-wd)*len} ${y+Math.sin(a-wd)*len} L${x+Math.cos(a+wd)*len} ${y+Math.sin(a+wd)*len}Z"/>`}return `<g fill="${col}" opacity="${op}">${s}</g>`}
function mtn(yb,amp,col,seed,dx,extra=''){let d=`M-300 2300 L-300 ${yb}`;for(let x=-300;x<=1400;x+=40){const y=yb-amp*(.55+.3*Math.sin((x+dx)*.0062+seed)+.18*Math.sin((x+dx)*.017+seed*2.1));d+=` L${x} ${y.toFixed(1)}`}d+=` L1400 2300Z`;return `<path d="${d}" fill="${col}" ${extra}/>`}
function mesa(x,yb,w,h,col){return `<path d="M${x-w/2-60} ${yb} L${x-w/2} ${yb-h} L${x+w/2} ${yb-h} L${x+w/2+60} ${yb}Z" fill="${col}"/><path d="M${x-w/2} ${yb-h} L${x+w/2} ${yb-h} L${x+w/2-10} ${yb-h+18} L${x-w/2+10} ${yb-h+18}Z" fill="${shade(col,.18)}"/>`}
function cloud(x,y,s,col='#fff',op=.85){return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}" fill="${col}"><circle cx="-60" cy="0" r="46"/><circle cx="0" cy="-26" r="62"/><circle cx="62" cy="-4" r="44"/><circle cx="110" cy="12" r="30"/><rect x="-106" y="0" width="246" height="44" rx="22"/></g>`}
function clouds(L,set,spd=14){return set.map(([x,y,s,c,o],i)=>cloud(((x+L*spd*(1+i%3*.4))%1500+1500)%1500-250,y,s,c,o)).join('')}
function birds(L,x0,y0,n=4){let s='';for(let i=0;i<n;i++){const x=x0+L*70+i*46,y=y0+Math.sin(i*2)*22+Math.sin(L*3+i)*6,f=Math.sin(L*14+i*1.7)*10;s+=`<path d="M${x-16} ${y-f} Q${x-8} ${y-4} ${x} ${y} Q${x+8} ${y-4} ${x+16} ${y-f}" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/>`}return s}
function stars(L,n=60,seed=5){let s='';for(let i=0;i<n;i++){const x=R(seed+i)*1080,y=R(seed+i*3.3)*1050,r=1.5+R(seed+i*7)*3.5,tw=.35+.65*Math.abs(Math.sin(L*2.2+i));s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff6d5" opacity="${tw}"/>`}return s}
function ground(y,col='url(#gSand)',amp=18,seed=1,dx=0){let d=`M-300 2300 L-300 ${y}`;for(let x=-300;x<=1400;x+=60){d+=` L${x} ${(y-amp*Math.sin((x+dx)*.008+seed)).toFixed(1)}`}return `<path d="${d} L1400 2300Z" fill="${col}"/>`}
function palm(x,yb,s,L,ph=0){const sw=Math.sin(L*1.6+ph)*4;let f='';for(let i=0;i<7;i++){const a=-160+i*24+sw*1.5;f+=`<g transform="rotate(${a})"><path d="M0 0 Q70 -36 150 -6 Q70 -12 0 0Z" fill="${i%2?'#2e8b57':'#3aa36a'}"/></g>`}
 return `<g transform="translate(${x},${yb}) scale(${s})"><path d="M-10 0 Q-4 -150 ${18+sw} -300 L${34+sw} -300 Q12 -150 12 0Z" fill="#a0673a"/>${[0,1,2,3,4,5].map(i=>`<path d="M${-8+i*3} ${-30-i*46} L${14+i*3.4+sw*i/6} ${-38-i*46}" stroke="#7a4a26" stroke-width="5"/>`).join('')}<g transform="translate(${26+sw},-300)">${f}<circle r="12" fill="#7a4a26"/></g></g>`}
function houses(yb,dx,s=1,seed=1,col='#f2d3a6'){let o='';for(let i=0;i<9;i++){const w=(90+R(seed+i)*80)*s,h=(80+R(seed+i*2)*140)*s,x=-200+i*170*s+dx;const c=shade(col,(R(seed+i*5)-.5)*.2);
 o+=`<rect x="${x}" y="${yb-h}" width="${w}" height="${h}" fill="${c}"/><rect x="${x-6}" y="${yb-h-10}" width="${w+12}" height="14" rx="4" fill="${shade(c,-.15)}"/><rect x="${x+w*.3}" y="${yb-h*.6}" width="${18*s}" height="${26*s}" rx="${8*s}" fill="${INK}" opacity=".55"/>`;
 if(R(seed+i*9)>.7)o+=`<path d="M${x+w*.15} ${yb-h-8} A${w*.35} ${w*.35} 0 0 1 ${x+w*.85} ${yb-h-8}Z" fill="${AQUA}"/>`}
 return o+`<rect x="-300" y="${yb-1}" width="1700" height="400" fill="${shade(col,-.1)}"/>`}
const ITEM={
 bag:`<g transform="translate(0,-10)"><path d="M-30 -40 Q-48 20 -26 40 L26 40 Q48 20 30 -40Z" fill="#c98a4a" stroke="#7a4a26" stroke-width="5"/><path d="M-22 -44 L22 -44 L14 -32 L-14 -32Z" fill="#a06a36"/><rect x="-18" y="-40" width="36" height="9" rx="4" fill="${GOLD}"/><circle cx="0" cy="8" r="14" fill="url(#gCoin)" stroke="#b07a10" stroke-width="3"/></g>`,
 coin:`<circle r="18" fill="url(#gCoin)" stroke="#b07a10" stroke-width="4"/><circle r="9" fill="none" stroke="#fff3b0" stroke-width="3"/>`,
 bread:`<ellipse cx="0" cy="-6" rx="38" ry="22" fill="#d9944a" stroke="#8a5424" stroke-width="5"/><path d="M-20 -14 L-12 -4 M0 -18 L6 -6 M18 -14 L24 -4" stroke="#f6c98a" stroke-width="5" stroke-linecap="round"/>`,
 quill:`<path d="M0 0 L-6 -20 Q-30 -90 -10 -130 Q4 -80 6 -20Z" fill="#fff" stroke="${INK}" stroke-width="3"/><path d="M0 0 L-4 -22" stroke="${INK}" stroke-width="3"/>`,
 lamp:`<circle cy="-30" r="70" fill="url(#gFire)" opacity=".8"/><path d="M-34 0 Q0 18 34 0 Q30 -14 0 -14 Q-30 -14 -34 0Z" fill="#c98a4a" stroke="#7a4a26" stroke-width="4"/><path d="M28 -8 L46 -18" stroke="#7a4a26" stroke-width="7" stroke-linecap="round"/><path d="M46 -22 Q56 -44 48 -58 Q40 -44 46 -22Z" fill="#ffb347"/>`,
 basket:`<path d="M-56 -40 L56 -40 L44 30 L-44 30Z" fill="#c98a4a" stroke="#7a4a26" stroke-width="5"/><path d="M-50 -14 L50 -14 M-46 10 L46 10" stroke="#a06a36" stroke-width="5"/><circle cx="-24" cy="-48" r="18" fill="#ff8f6b"/><circle cx="8" cy="-52" r="20" fill="#9ccf6a"/><circle cx="34" cy="-46" r="16" fill="#ffd36b"/>`
};
function person(o){
 const {x=0,y=0,s=1,robe='#2fa39a',cloth='#f6e7c8',skin='#c98d62',aL=12,aR=-12,head=0,item=null,itemR=0,itemL=null,itemLR=0,flip=false,crown=false,sash=GOLD,bob=0,step=0,beard='#5a3626',op=1,sil=null,lean=0}=o;
 const rb=sil||robe,dk=sil||shade(robe,-.22),sk=sil||skin,cl=sil||cloth,sa=sil||sash;
 const arm=(sd,a,it,ir)=>`<g transform="translate(${sd*30},-190) rotate(${a})"><rect x="-13" y="-8" width="26" height="102" rx="13" fill="${dk}"/><circle cx="0" cy="98" r="15" fill="${sk}"/>${it?`<g transform="translate(0,100) rotate(${ir-a})">${ITEM[it]}</g>`:''}</g>`;
 const fx=Math.sin(step)*16;
 return `<g transform="translate(${x},${y+bob}) scale(${s*(flip?-1:1)},${s})" opacity="${op}"><g transform="rotate(${lean} 0 0)">
 <ellipse cx="0" cy="4" rx="74" ry="13" fill="#0a2a30" opacity="${sil?0:.18}"/>
 <ellipse cx="${-22+fx}" cy="-2" rx="20" ry="9" fill="${sil||'#5a3a2a'}"/><ellipse cx="${22-fx}" cy="-2" rx="20" ry="9" fill="${sil||'#5a3a2a'}"/>
 <path d="M-34 -206 Q-46 -100 -66 -4 L66 -4 Q46 -100 34 -206 Q0 -222 -34 -206Z" fill="${rb}"/>
 <path d="M-30 -202 L36 -112 L22 -100 L-38 -186Z" fill="${sa}" opacity="${sil?1:.9}"/>
 <rect x="-44" y="-124" width="88" height="14" rx="6" fill="${dk}"/>
 <g transform="rotate(${head} 0 -214)">
  <path d="M-44 -244 Q-46 -296 0 -298 Q46 -296 44 -244 L50 -196 Q0 -186 -50 -196Z" fill="${cl}"/>
  <circle cx="0" cy="-246" r="31" fill="${sk}"/>
  ${beard&&!sil?`<path d="M-26 -236 Q0 -196 26 -236 Q14 -220 0 -220 Q-14 -220 -26 -236Z" fill="${beard}"/>`:''}
  ${crown?`<path d="M-34 -268 L-34 -306 L-18 -286 L0 -314 L18 -286 L34 -306 L34 -268Z" fill="${sil||GOLD}" stroke="${sil||'#b86e1a'}" stroke-width="4"/>`:`<path d="M-38 -254 Q-38 -294 0 -294 Q38 -294 38 -254 Q0 -272 -38 -254Z" fill="${cl}"/><path d="M-38 -258 Q0 -276 38 -258" stroke="${sil||shade(cloth,-.3)}" stroke-width="7" fill="none"/>`}
 </g>
 ${arm(-1,aL,itemL,itemLR)}${arm(1,aR,item,itemR)}
 </g></g>`}
/* gacela (perfil, mirando a la derecha) mode 0 parada,1 corre,2 salto */
function gacela(x,y,s,ph,mode=1,o={}){
 const sil=o.sil||null,B=sil||'#d99a5b',D=sil||'#6e3f22',Wh=sil||'#fff4e0',far=sil||shade('#d99a5b',-.2);
 const leg=(hx,a1,a2,c)=>`<g transform="translate(${hx},-112) rotate(${a1})"><rect x="-7" y="-4" width="14" height="56" rx="7" fill="${c}"/><g transform="translate(0,50) rotate(${a2})"><rect x="-5" y="-2" width="10" height="56" rx="5" fill="${c}"/><path d="M-6 52 L6 52 L5 62 L-6 62Z" fill="${sil||'#2b1a12'}"/></g></g>`;
 let fA=[0,0,0,0],hA=[0,0,0,0];
 if(mode==1){const a=Math.sin(ph),b=Math.sin(ph+.9);fA=[-34*a,40*clamp(Math.sin(ph+1.4),0,1),-34*b,40*clamp(Math.sin(ph+2.3),0,1)];hA=[30*Math.sin(ph+3.1),-36*clamp(Math.sin(ph+4.4),0,1),30*Math.sin(ph+4),-36*clamp(Math.sin(ph+5.3),0,1)]}
 if(mode==2){fA=[-72,70,-62,62];hA=[66,-14,58,-8]}
 if(mode==0){const w=Math.sin(ph)*3;fA=[w,0,-4+w,0];hA=[4,0,-w,0]}
 const tilt=mode==2?-12:mode==1?Math.sin(ph*2)*2:0,bob=mode==1?-Math.abs(Math.sin(ph))*14:0;
 const ha=o.head!=null?o.head:(mode==0?Math.sin(ph*.7)*4:6);
 return `<g transform="translate(${x},${y+bob*s}) scale(${s*(o.flip?-1:1)},${s}) rotate(${tilt})">
 ${mode!=2?`<ellipse cx="0" cy="${-bob+4}" rx="80" ry="12" fill="#0a2a30" opacity="${sil?0:.18}"/>`:''}
 ${leg(48,fA[2],fA[3],far)}${leg(-44,hA[2],hA[3],far)}
 <path d="M-70 -132 Q-90 -128 -86 -110" stroke="${D}" stroke-width="8" fill="none" stroke-linecap="round" transform="rotate(${Math.sin(ph*3)*14} -70 -132)"/>
 <ellipse cx="0" cy="-122" rx="74" ry="31" fill="${B}"/>
 <ellipse cx="-62" cy="-124" rx="13" ry="20" fill="${Wh}"/>
 <path d="M-56 -106 Q0 -84 58 -108 Q0 -96 -56 -106Z" fill="${Wh}"/>
 <path d="M-58 -114 Q0 -100 58 -114" stroke="${D}" stroke-width="7" fill="none" stroke-linecap="round"/>
 <path d="M36 -142 L72 -206 L96 -198 L66 -120Z" fill="${B}"/>
 <g transform="translate(86,-208) rotate(${ha})">
  <path d="M-2 -12 Q-16 -50 6 -80 Q-4 -50 6 -14Z" fill="${D}"/><path d="M6 -12 Q-2 -54 20 -78 Q8 -48 13 -12Z" fill="${sil||'#55301a'}"/>
  <path d="M-8 -8 Q-34 -26 -18 -2Z" fill="${B}"/>
  <ellipse cx="12" cy="0" rx="27" ry="15" fill="${B}"/>
  <path d="M-4 -6 Q16 -12 36 0" stroke="${Wh}" stroke-width="4" fill="none"/>
  <circle cx="38" cy="4" r="6" fill="${sil||'#2b1a12'}"/>
  ${sil?'':`<circle cx="10" cy="-3" r="4.5" fill="#1a1a1a"/>`}
 </g>
