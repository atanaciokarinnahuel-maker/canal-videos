<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470">
  <!-- Chispa: mascota ORIGINAL del canal "Tecnología e IA". Robotito redondo celeste con antena y pantalla-cara.
       Partes con id para animar: ant (antena, pivote 200,118), bulb, armL (pivote 78,270), armR (pivote 322,270),
       eyes/eL/eR (ojos), gL/gR (brillos), mouth (boca), mo (boca abierta), face (pantalla), feet. -->
  <defs>
    <linearGradient id="chBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FE3FF"/><stop offset=".55" stop-color="#4FC3F7"/><stop offset="1" stop-color="#2196E0"/></linearGradient>
    <linearGradient id="chScr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173A6B"/><stop offset="1" stop-color="#0B1E40"/></linearGradient>
    <radialGradient id="chBulb" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#FFFBD0"/><stop offset=".5" stop-color="#FFE14D"/><stop offset="1" stop-color="#FFB300"/></radialGradient>
  </defs>
  <ellipse cx="200" cy="452" rx="120" ry="14" fill="#000" opacity=".18"/>
  <g id="feet"><rect x="128" y="398" width="58" height="44" rx="20" fill="#2196E0" stroke="#12305E" stroke-width="9"/><rect x="214" y="398" width="58" height="44" rx="20" fill="#2196E0" stroke="#12305E" stroke-width="9"/></g>
  <g id="ant"><line x1="200" y1="118" x2="200" y2="58" stroke="#12305E" stroke-width="12" stroke-linecap="round"/><circle id="bulb" cx="200" cy="44" r="20" fill="url(#chBulb)" stroke="#12305E" stroke-width="7"/><circle cx="194" cy="38" r="6" fill="#fff" opacity=".9"/></g>
  <g id="armL"><rect x="30" y="250" width="56" height="112" rx="28" fill="#4FC3F7" stroke="#12305E" stroke-width="9" transform="rotate(18 78 270)"/><circle cx="52" cy="370" r="24" fill="#FFE14D" stroke="#12305E" stroke-width="8"/></g>
  <g id="armR"><rect x="314" y="250" width="56" height="112" rx="28" fill="#4FC3F7" stroke="#12305E" stroke-width="9" transform="rotate(-18 322 270)"/><circle cx="348" cy="370" r="24" fill="#FFE14D" stroke="#12305E" stroke-width="8"/></g>
  <rect x="62" y="112" width="276" height="300" rx="138" fill="url(#chBody)" stroke="#12305E" stroke-width="12"/>
  <ellipse cx="150" cy="160" rx="52" ry="18" fill="#fff" opacity=".55" transform="rotate(-18 150 160)"/>
  <rect id="face" x="98" y="168" width="204" height="160" rx="66" fill="url(#chScr)" stroke="#12305E" stroke-width="7"/>
  <g id="eyes">
    <ellipse id="eL" cx="158" cy="240" rx="22" ry="30" fill="#8CF6FF"/>
    <ellipse id="eR" cx="242" cy="240" rx="22" ry="30" fill="#8CF6FF"/>
    <circle id="gL" cx="166" cy="229" r="8" fill="#fff"/>
    <circle id="gR" cx="250" cy="229" r="8" fill="#fff"/>
  </g>
  <path id="mouth" d="M168 292 Q200 318 232 292" stroke="#8CF6FF" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse id="mo" cx="200" cy="298" rx="20" ry="0" fill="#8CF6FF"/>
  <circle cx="120" cy="296" r="11" fill="#FF8AC4" opacity=".7"/><circle cx="280" cy="296" r="11" fill="#FF8AC4" opacity=".7"/>
  <rect x="164" y="350" width="72" height="36" rx="14" fill="#12305E"/><text x="200" y="377" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="26" fill="#FFE14D">IA</text>
</svg>
