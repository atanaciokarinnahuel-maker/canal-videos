function drawCv(T,c){
 cx.clearRect(0,0,1080,1920);
 AMB.forEach(p=>{const k=p.z;const y=((p.y-T*p.v)%1920+1920)%1920;const x=p.x+Math.sin(T*.8+p.ph)*20;
  const X=540+(x-540)*(1+(c.s-1)*k*.5)+(540-c.px)*k*.5,Y=860+(y-860)*(1+(c.s-1)*k*.5)+(860-c.py)*k*.5;
  const tw=.4+.6*Math.abs(Math.sin(T*2+p.ph));cx.globalAlpha=.5*tw;cx.fillStyle=p.c;cx.beginPath();cx.arc(X,Y,p.s*k,0,7);cx.fill()});
 cx.globalAlpha=1;
 // hojas de texto que entran al núcleo
 DOCS.forEach(d=>{const u=(T-d.t)/.75;if(u<0||u>1)return;const e=ei(u);const x=lerp(d.x,540,e),y=lerp(d.y,600,e);const [X,Y]=w2s(c,x,y);const s=(1-e*.7)*c.s;
  cx.save();cx.translate(X,Y);cx.rotate(d.r+u*4);cx.scale(s,s);cx.globalAlpha=Math.min(1,(1-u)*3);cx.fillStyle=d.c;cx.strokeStyle=INK;cx.lineWidth=5;
  cx.beginPath();cx.roundRect(-34,-44,68,88,8);cx.fill();cx.stroke();cx.fillStyle='#9fb0d6';for(let k=0;k<4;k++)cx.fillRect(-22,-28+k*16,k==3?28:44,6);cx.restore()});
 cx.globalAlpha=1;
 // chispas de la mecha (coordenadas de pantalla)
 if(T<FUSE_END){const pt=$('fuseRope').getPointAtLength(Math.min(FUSE_LEN*clamp(T/FUSE_END),FUSE_LEN-1));
  for(let i=0;i<14;i++){const ph=(T*3+i/14)%1;const a=i*2.4+Math.floor(T*3+i/14)*1.7;const r=ph*60;cx.globalAlpha=1-ph;cx.fillStyle=i%2?'#FFE14D':'#FF9F43';cx.beginPath();cx.arc(pt.x+Math.cos(a)*r,pt.y+Math.sin(a)*r-ph*20+ph*ph*40,4*(1-ph)+1.5,0,7);cx.fill()}}
 cx.globalAlpha=1;
 BURSTS.forEach(b=>{const d=T-b.t;if(d<0||d>b.life)return;const al=1-Math.pow(d/b.life,2);const [bxx,byy]=b.scr?[b.x,b.y]:w2s(c,b.x,b.y);
  b.arr.forEach(q=>{const x=bxx+Math.cos(q.a)*q.v*d*(1-d/(b.life*2.2)),y=byy+Math.sin(q.a)*q.v*d*(1-d/(b.life*2.2))+520*d*d;
   cx.save();cx.globalAlpha=al;cx.translate(x,y);cx.rotate(q.r+d*7);cx.fillStyle=q.c;cx.strokeStyle=INK;cx.lineWidth=2.5;
   if(q.k=='star'){cx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?q.s*.35:q.s;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fill()}
   else{cx.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);cx.strokeRect(-q.s/2,-q.s/4,q.s,q.s/2)}cx.restore()})});
 // brillo de barrido (transiciones sin corte)
 SHINE.forEach(t=>{const p=(T-t)/.5;if(p<0||p>1)return;const x=lerp(-600,1700,eio(p));const g=cx.createLinearGradient(x-260,0,x+260,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(255,255,255,0)');
  cx.save();cx.setTransform(1,0,-.35,1,0,0);cx.fillStyle=g;cx.fillRect(x-260+300,0,520,1920);cx.restore()});
}
