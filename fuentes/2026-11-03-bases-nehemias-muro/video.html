<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#2a1a40}
#stage{position:absolute;inset:0;overflow:hidden;transform-origin:540px 960px}
.L{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.L svg{position:absolute;left:0;top:0;overflow:visible}
#cv{position:absolute;left:0;top:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(0,0,0,0) 60%,rgba(40,14,50,.42) 100%)}
.kt{position:absolute;left:30px;right:30px;text-align:center;font-family:'Inter Display','Inter';font-weight:900;line-height:.98;letter-spacing:-1px;color:#fff;-webkit-text-stroke:16px #3a1f4f;paint-order:stroke fill;text-shadow:0 10px 0 #3a1f4f;transform-origin:50% 50%;display:none}
.kt .g{color:#ffd23f}.kt .r{color:#ff8fab}.kt .t{color:#7ff0dd}.kt .o{color:#ffab5e}
.kt .sm{font-size:.5em;letter-spacing:0}
.tag{display:inline-block;padding:14px 34px;border-radius:50px;background:#fff;color:#3a1f4f;border:7px solid #3a1f4f;box-shadow:0 9px 0 #3a1f4f;-webkit-text-stroke:0;text-shadow:none;font-size:44px;letter-spacing:0}
.tag.gold{background:#ffd23f}.tag.teal{background:#7ff0dd}.tag.rose{background:#ffb3c6}
#subs{position:absolute;left:40px;right:40px;top:1405px;height:150px;text-align:center;font-family:'Inter Display','Inter';font-weight:900;font-size:64px;line-height:1.08}
#subs span{display:inline-block;margin:0 13px;color:#fff;-webkit-text-stroke:12px #3a1f4f;paint-order:stroke fill;transform-origin:50% 70%}
#subs span.on{color:#ffd23f}
#bar{position:absolute;left:70px;top:120px;width:940px;height:30px;display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(58,31,79,.78);border:4px solid #fff}
#bar i{flex:1;border-radius:4px;background:rgba(255,255,255,.14)}
#bar i.on{background:linear-gradient(#ffe27a,#f2a93b);box-shadow:0 0 10px #ffd23f}
#chip{position:absolute;left:70px;top:176px;padding:10px 26px;border-radius:40px;background:rgba(255,255,255,.94);color:#3a1f4f;border:5px solid #3a1f4f;font-family:'Inter Display';font-weight:900;font-size:36px;white-space:nowrap;transform-origin:0 50%}
#chip b{color:#c2410c}
#flash{position:absolute;inset:0;background:#fff8e6;opacity:0}
#edge{position:absolute;top:0;width:60px;height:1920px;background:linear-gradient(90deg,rgba(255,210,63,0),#fff3c4,rgba(255,210,63,0));display:none}
</style></head><body>

 <linearGradient id="skyCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b44a6"/><stop offset=".6" stop-color="#b56cc4"/><stop offset="1" stop-color="#ff9fb1"/></linearGradient>

 <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#e8962a"/></linearGradient>
 <linearGradient id="gSand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c487"/><stop offset="1" stop-color="#c98a55"/></linearGradient>

 <linearGradient id="gRay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8dc" stop-opacity=".55"/><stop offset="1" stop-color="#fff8dc" stop-opacity="0"/></linearGradient>
 <linearGradient id="gBlade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd8e6"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#9fb0c6"/></linearGradient>
 <linearGradient id="gCarpet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8344f"/><stop offset="1" stop-color="#e2506a"/></linearGradient>

<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const ei=t=>Math.pow(clamp(t),2.2);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const elastic=t=>{t=clamp(t);if(t===0||t===1)return t;return Math.pow(2,-9*t)*Math.sin((t*9-.75)*2*Math.PI/3)+1};
const bounce=t=>{t=clamp(t);const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
const $=id=>document.getElementById(id);
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const P=(L,a,d)=>clamp((L-a)/d);
function kf(T,a,ease=eio){if(T<=a[0][0])return a[0].slice(1);for(let i=1;i<a.length;i++){if(T<=a[i][0]){const d=a[i][0]-a[i-1][0];const u=d<=0?1:ease((T-a[i-1][0])/d);return a[i].slice(1).map((v,k)=>lerp(a[i-1][k+1],v,u))}}return a[a.length-1].slice(1)}
function hex(c){return [1,3,5].map(i=>parseInt(c.substr(i,2),16))}
function shade(c,f){const A=hex(c);return '#'+A.map(v=>Math.round(clamp(f<0?v*(1+f):v+(255-v)*f,0,255)).toString(16).padStart(2,'0')).join('')}
const INK='#3a1f4f',GOLD='#ffd23f';
let W=[],VOICE=0,DUR=0,GROUPS=[];
const F=`font-family="Inter Display" font-weight="900"`;
/* ===================== piezas ===================== */
const sky=id=>`<rect x="-300" y="-300" width="1680" height="2520" fill="url(#${id})"/>`;
function sun(x,y,r,op=1){return `<circle cx="${x}" cy="${y}" r="${r*3.2}" fill="url(#gSun)" opacity="${.75*op}"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff4d0" opacity="${op}"/>`}
function rays(x,y,n,len,rot,op,col='#fff8dc',wd=.07){let s='';for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;s+=`<path d="M${x} ${y} L${x+Math.cos(a-wd)*len} ${y+Math.sin(a-wd)*len} L${x+Math.cos(a+wd)*len} ${y+Math.sin(a+wd)*len}Z"/>`}return `<g fill="${col}" opacity="${op}">${s}</g>`}
function mtn(yb,amp,col,seed,dx,extra=''){let d=`M-300 2300 L-300 ${yb}`;for(let x=-300;x<=1400;x+=40){const X=x+((dx%800)+800)%800-800+0;const y=yb-amp*(.55+.3*Math.sin((x+dx)*.0062+seed)+.18*Math.sin((x+dx)*.017+seed*2.1));d+=` L${x} ${y.toFixed(1)}`}d+=` L1400 2300Z`;return `<path d="${d}" fill="${col}" ${extra}/>`}
function cloud(x,y,s,col='#ffe3ec',op=.85){return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}" fill="${col}"><circle cx="-60" cy="0" r="46"/><circle cx="0" cy="-26" r="62"/><circle cx="62" cy="-4" r="44"/><circle cx="110" cy="12" r="30"/><rect x="-106" y="0" width="246" height="44" rx="22"/></g>`}
function clouds(L,set,spd=14){return set.map(([x,y,s,c,o],i)=>cloud(((x+L*spd*(1+i%3*.4))%1500+1500)%1500-250,y,s,c,o)).join('')}
function birds(L,x0,y0,n=4){let s='';for(let i=0;i<n;i++){const x=x0+L*70+i*46,y=y0+Math.sin(i*2)*22+Math.sin(L*3+i)*6,f=Math.sin(L*14+i*1.7)*10;s+=`<path d="M${x-16} ${y-f} Q${x-8} ${y-4} ${x} ${y} Q${x+8} ${y-4} ${x+16} ${y-f}" stroke="#4b2f63" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>`}return s}
function stars(L,n=60,seed=5){let s='';for(let i=0;i<n;i++){const x=R(seed+i)*1080,y=R(seed+i*3.3)*1050,r=1.5+R(seed+i*7)*3.5,tw=.35+.65*Math.abs(Math.sin(L*2.2+i));s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff6d5" opacity="${tw}"/>`}return s}
function ground(y,col='url(#gSand)',amp=18,seed=1,dx=0){let d=`M-300 2300 L-300 ${y}`;for(let x=-300;x<=1400;x+=60){d+=` L${x} ${(y-amp*Math.sin((x+dx)*.008+seed)).toFixed(1)}`}return `<path d="${d} L1400 2300Z" fill="${col}"/>`}
function stone(x,y,s,c='#d89c5c'){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-40 0 L-34 -30 L-6 -44 L30 -36 L44 -8 L36 6 L-30 8Z" fill="${c}"/><path d="M-34 -30 L-6 -44 L30 -36 L10 -24Z" fill="${shade(c,.25)}"/><path d="M36 6 L-30 8 L-40 0 L0 -6Z" fill="${shade(c,-.25)}"/></g>`}
/* muralla */
function wall(x0,yb,w,h,o={}){
 const cw=o.cw||54,bh=o.bh||36,seed=o.seed||1,br=o.broken||0,rise=o.rise==null?1:o.rise,n=Math.ceil(w/cw);const H=[];
 for(let i=0;i<n;i++){let f=1-br*Math.pow(R(seed*31+i),.7);if(o.gapC!=null&&Math.abs(i-o.gapC)<2.5)f=Math.min(f,.18);
  let rr=rise;if(o.stag)rr=clamp(rise*1.25-(R(seed+i*3)*.25));H.push(Math.max(0,h*f*clamp(rr)))}
 const cols=o.cols||['#f2c584','#e6ae6c','#d99d5d','#edbb7b','#e0a566'];
 let d=`M${x0} ${yb}`;for(let i=0;i<n;i++){const xa=x0+i*cw,xb=Math.min(x0+w,xa+cw);d+=` L${xa} ${yb-H[i]} L${xb} ${yb-H[i]}`}d+=` L${x0+w} ${yb}Z`;
 let s=`<path d="${d}" fill="${o.mortar||'#9c6a44'}"/>`;const rows=Math.ceil(h/bh)+1;
 for(let j=0;j<rows;j++){const off=(j%2)*cw/2;for(let k=-1;k<=n;k++){const bx=x0+k*cw+off,cx=bx+cw/2,ci=Math.floor((cx-x0)/cw);if(ci<0||ci>=n)continue;if((j+1)*bh>H[ci]+3)continue;
  const xa=Math.max(bx,x0),xb=Math.min(bx+cw,x0+w);if(xb-xa<8)continue;s+=`<rect x="${xa+2}" y="${yb-(j+1)*bh+2}" width="${xb-xa-4}" height="${bh-4}" rx="5" fill="${cols[Math.floor(R(seed+j*17+k*7)*cols.length)]}"/>`}}
 if(o.crenel){for(let i=0;i<n;i+=2){if(H[i]>=h*.97)s+=`<rect x="${x0+i*cw+5}" y="${yb-H[i]-38}" width="${cw-10}" height="40" rx="5" fill="${cols[i%cols.length]}" stroke="${o.mortar||'#9c6a44'}" stroke-width="4"/>`}}
 s+=`<path d="${d}" fill="url(#gShade)"/>`;
 return `<g ${o.tr?`transform="${o.tr}"`:''}>${s}</g>`}
function gate(x,yb,w,h,burnt){const a=`M${x-w/2} ${yb} L${x-w/2} ${yb-h+w/2} A${w/2} ${w/2} 0 0 1 ${x+w/2} ${yb-h+w/2} L${x+w/2} ${yb}Z`;
 if(burnt){let e='';for(let i=0;i<7;i++)e+=`<circle cx="${x-w/2+10+R(i+40)*(w-20)}" cy="${yb-10-R(i+50)*h*.5}" r="${4+R(i)*5}" fill="#ff9a4a" opacity=".7"/>`;return `<path d="${a}" fill="#3a2234"/><path d="M${x-w/2+12} ${yb} L${x-w/2+30} ${yb-h*.55} L${x-6} ${yb-h*.35} L${x+18} ${yb-h*.6} L${x+w/2-14} ${yb}Z" fill="#241520"/>${e}`}
 let pl='';for(let i=1;i<5;i++)pl+=`<line x1="${x-w/2+i*w/5}" y1="${yb}" x2="${x-w/2+i*w/5}" y2="${yb-h+w/2-(i==2||i==3?w*.4:w*.2)}" stroke="#6b3a24" stroke-width="5"/>`;
 return `<path d="${a}" fill="#9a5a32" stroke="#6b3a24" stroke-width="8"/>${pl}<circle cx="${x+w*.18}" cy="${yb-h*.35}" r="8" fill="${GOLD}"/>`}
function tower(x,yb,w,h,c='#e6ae6c',broken=0){const top=yb-h;let s=`<rect x="${x-w/2}" y="${top}" width="${w}" height="${h}" fill="${c}"/>`;
 if(!broken){for(let i=0;i<3;i++)s+=`<rect x="${x-w/2+i*w/3+4}" y="${top-34}" width="${w/3-8}" height="36" fill="${c}"/>`;s+=`<rect x="${x-10}" y="${top+40}" width="20" height="44" rx="10" fill="#5a2f45"/>`}
 else s+=`<path d="M${x-w/2} ${top} L${x-w/4} ${top+30} L${x} ${top+10} L${x+w/5} ${top+46} L${x+w/2} ${top+18} L${x+w/2} ${top-2}Z" fill="#00000000"/>`;
 return s+`<rect x="${x-w/2}" y="${top}" width="${w}" height="${h}" fill="url(#gShade)"/>`}
/* personaje */
const ITEM={
 cup:`<path d="M-22 -50 L22 -50 L15 -18 Q0 -6 -15 -18Z" fill="url(#gGold)" stroke="#b86e1a" stroke-width="3"/><rect x="-3" y="-18" width="6" height="16" fill="#e0a030"/><rect x="-15" y="-4" width="30" height="7" rx="3" fill="#e0a030"/>`,
 brick:`<rect x="-38" y="-24" width="76" height="40" rx="6" fill="#e0894c" stroke="#9c5a30" stroke-width="5"/><line x1="-30" y1="-12" x2="30" y2="-12" stroke="#f7b07c" stroke-width="5" stroke-linecap="round"/>`,
 sword:`<path d="M-7 -20 L-7 -150 L0 -172 L7 -150 L7 -20Z" fill="url(#gBlade)" stroke="#7d8ca3" stroke-width="3"/><rect x="-30" y="-26" width="60" height="12" rx="5" fill="${GOLD}" stroke="#b86e1a" stroke-width="3"/><rect x="-6" y="-14" width="12" height="30" rx="3" fill="#7a4a2a"/><circle cy="20" r="8" fill="${GOLD}"/>`,
 spear:`<rect x="-4" y="-230" width="8" height="270" fill="#8a5a32"/><path d="M-12 -228 L0 -270 L12 -228Z" fill="#dfe6f0" stroke="#7d8ca3" stroke-width="3"/>`,
 lantern:`<line x1="0" y1="0" x2="0" y2="26" stroke="#5a3a2a" stroke-width="4"/><circle cy="50" r="70" fill="url(#gFire)" opacity=".8"/><rect x="-16" y="26" width="32" height="42" rx="8" fill="#ffd36b" stroke="#7a4a2a" stroke-width="5"/>`,
 trowel:`<rect x="-5" y="-40" width="10" height="40" rx="4" fill="#7a4a2a"/><path d="M0 -40 L-26 -66 L0 -100 L26 -66Z" fill="#cfd8e6" stroke="#7d8ca3" stroke-width="3"/>`,
 torch:`<rect x="-5" y="-110" width="10" height="120" fill="#6b3a24"/><circle cy="-130" r="70" fill="url(#gFire)"/><path d="M0 -175 Q22 -140 12 -118 Q0 -108 -12 -118 Q-22 -140 0 -175Z" fill="#ffb347"/><path d="M0 -150 Q10 -132 5 -120 Q0 -116 -5 -120 Q-10 -132 0 -150Z" fill="#fff2b0"/>`,
 scroll:`<rect x="-30" y="-20" width="60" height="34" rx="6" fill="#f7e6c4" stroke="#b08a5a" stroke-width="4"/><circle cx="-30" cy="-3" r="10" fill="#d8b98a"/><circle cx="30" cy="-3" r="10" fill="#d8b98a"/>`
};
function person(o){
 const {x=0,y=0,s=1,robe='#2fa39a',cloth='#f6e7c8',skin='#c98d62',aL=12,aR=-12,head=0,item=null,itemR=0,itemL=null,itemLR=0,flip=false,crown=false,sash=GOLD,bob=0,step=0,beard='#5a3626',op=1,sil=null}=o;
 const rb=sil||robe,dk=sil||shade(robe,-.22),sk=sil||skin,cl=sil||cloth,sa=sil||sash;
 const arm=(sd,a,it,ir)=>`<g transform="translate(${sd*30},-190) rotate(${a})"><rect x="-13" y="-8" width="26" height="102" rx="13" fill="${dk}"/><circle cx="0" cy="98" r="15" fill="${sk}"/>${it?`<g transform="translate(0,100) rotate(${ir-a})">${sil&&it!='torch'?ITEM[it].replace(/fill="#[^"]*"/g,`fill="${sil}"`).replace(/stroke="[^"]*"/g,'stroke="none"'):ITEM[it]}</g>`:''}</g>`;
 const fx=Math.sin(step)*16;
 return `<g transform="translate(${x},${y+bob}) scale(${s*(flip?-1:1)},${s})" opacity="${op}">
 <ellipse cx="0" cy="4" rx="74" ry="13" fill="#2a1030" opacity="${sil?0:.18}"/>
 <ellipse cx="${-22+fx}" cy="-2" rx="20" ry="9" fill="${sil||'#5a3a2a'}"/><ellipse cx="${22-fx}" cy="-2" rx="20" ry="9" fill="${sil||'#5a3a2a'}"/>
 <path d="M-34 -206 Q-46 -100 -66 -4 L66 -4 Q46 -100 34 -206 Q0 -222 -34 -206Z" fill="${rb}"/>
 <path d="M-30 -202 L36 -112 L22 -100 L-38 -186Z" fill="${sa}" opacity="${sil?1:.9}"/>
 <rect x="-44" y="-124" width="88" height="14" rx="6" fill="${dk}"/>
 <g transform="rotate(${head} 0 -214)">
  <path d="M-44 -244 Q-46 -296 0 -298 Q46 -296 44 -244 L50 -196 Q0 -186 -50 -196Z" fill="${cl}"/>
  <circle cx="0" cy="-246" r="31" fill="${sk}"/>
  ${beard&&!sil?`<path d="M-26 -236 Q0 -196 26 -236 Q14 -220 0 -220 Q-14 -220 -26 -236Z" fill="${beard}"/>`:''}
  ${crown?`<path d="M-34 -268 L-34 -306 L-18 -286 L0 -314 L18 -286 L34 -306 L34 -268Z" fill="${sil||GOLD}" stroke="${sil||'#b86e1a'}" stroke-width="4"/>`:`<path d="M-38 -254 Q-38 -294 0 -294 Q38 -294 38 -254 Q0 -272 -38 -254Z" fill="${cl}"/><path d="M-38 -258 Q0 -276 38 -258" stroke="${sil||shade(cloth,-.3)}" stroke-width="7" fill="none"/>`}
 </g>
 ${arm(-1,aL,itemL,itemLR)}${arm(1,aR,item,itemR)}

function buildKT(){$('kts').innerHTML=KT.map((k,i)=>`<div class="kt" id="kt${i}" style="top:${k[2]}px;${k[3]?`font-size:${k[3]}px`:''}">${k[4]}</div>`).join('')}
function renderKT(T){KT.forEach((k,i)=>{const el=$('kt'+i);if(T<k[0]||T>k[1]){el.style.display='none';return}el.style.display='block';
 const u=T-k[0],out=P(T,k[1]-.2,.2);let sc=1,tx=0,ry=0,op=1-out;
 if(k[5]=='slam'){sc=lerp(2.4,1,eo(u/.22));op*=clamp(u/.1);if(u>.22)sc=1+.04*Math.sin((u-.22)*6)}
 else if(k[5]=='pop'){sc=back(u/.35);ry=Math.sin(u*2.4)*1.2}
 else if(k[5]=='slide'){tx=lerp(-1100,0,eo(u/.4));ry=0}
 sc*=1-.25*out;el.style.opacity=op;el.style.transform=`translateX(${tx}px) scale(${sc}) rotate(${ry}deg)`})}

function buildGroups(){let cur=[];const out=[];W.forEach((w,i)=>{cur.push(i);const txt=cur.map(j=>W[j].text).join(' ');const end=/[.,!?:;…]$/.test(w.text);if(end||cur.length>=4||txt.length>18){out.push(cur);cur=[]}});if(cur.length)out.push(cur);GROUPS=out}
function renderSubs(T){let g=-1;for(let i=0;i<GROUPS.length;i++){if(T>=W[GROUPS[i][0]].start-.08)g=i}
 const el=$('subs');if(g<0||T>VOICE+.25){el.innerHTML='';return}const grp=GROUPS[g];const last=W[grp[grp.length-1]];if(T>last.end+.6&&(g==GROUPS.length-1||T<W[GROUPS[g+1][0]].start-.08)){el.innerHTML='';return}
 el.innerHTML=grp.map(j=>{const w=W[j],on=T>=w.start-.03&&T<=(j+1<W.length?Math.max(w.end,W[j+1].start-.03):w.end+.4);const p=P(T,w.start-.03,.14);const sc=on?1+.12*Math.sin(p*Math.PI)+.06:1;return `<span class="${on?'on':''}" style="transform:scale(${sc.toFixed(3)})">${w.text}</span>`}).join(' ');
 const gp=P(T,W[grp[0]].start-.08,.12);el.style.transform=`translateY(${(1-eo(gp))*24}px)`;el.style.opacity=clamp(gp*1.5)}

const NB=26;function buildBar(){$('bar').innerHTML=Array.from({length:NB},()=>'<i></i>').join('')}
function renderBar(T){const p=T/DUR;const k=Math.floor(p*NB+.001);[...$('bar').children].forEach((e,i)=>{e.className=i<k?'on':'';e.style.transform=i==k-1?`scaleY(${1+.4*Math.max(0,1-((p*NB)%1)*4)})`:''})}
let lastChip='';function renderChip(T,i,L){const c=SC[i].chip;const el=$('chip');if(!c){el.style.display='none';return}el.style.display='block';if(c!==lastChip){el.innerHTML=c+(SC[i].noP?'':' · <b>paráfrasis</b>');lastChip=c}
 const p=back(P(L,.15,.35));el.style.transform=`scale(${p})`;el.style.opacity=clamp(P(L,.15,.15))}

const BT=[[3.62,540,860,40],[4.66,540,1180,26],[9.0,540,900,18],[14.1,690,700,22],[15.75,540,520,30],[21.06,540,420,34],[23.46,540,620,22],[25.92,650,850,24],[27.6,620,860,30],[29.0,540,500,26],[33.12,540,760,24],[37.0,760,880,28],[40.3,540,620,44],[41.38,540,420,40],[41.6,250,900,26],[41.8,850,900,26],[44.5,540,450,34],[47.62,540,1260,30],[49.18,540,1250,30],[53.84,540,1080,40]];
const BURSTS=BT.map(([t,x,y,n],k)=>({t,x,y,arr:Array.from({length:n},(_,i)=>({a:R(k*100+i)*Math.PI*2,v:380+R(k*100+i+50)*700,s:7+R(k*77+i)*12,c:['#ffd23f','#ff8fab','#7ff0dd','#fff','#ffab5e'][i%5],r:R(i+k)*6,st:i%3==0}))}));
function drawCv(T,night){cx.clearRect(0,0,1080,1920);
 DUST.forEach(p=>{const y=((p.y-T*p.v)%1920+1920)%1920,x=p.x+Math.sin(T*.7+p.ph)*24,tw=.35+.65*Math.abs(Math.sin(T*1.8+p.ph));cx.globalAlpha=(night?.7:.5)*tw;cx.fillStyle=p.c;cx.beginPath();cx.arc(x,y,p.s,0,7);cx.fill()});
 BURSTS.forEach(b=>{const d=T-b.t;if(d<0||d>1.3)return;const al=1-Math.pow(d/1.3,2);b.arr.forEach(q=>{const x=b.x+Math.cos(q.a)*q.v*d*(1-d/2.6),y=b.y+Math.sin(q.a)*q.v*d*(1-d/2.6)+600*d*d;cx.globalAlpha=al;cx.fillStyle=q.c;cx.save();cx.translate(x,y);cx.rotate(q.r+d*8);
  if(q.st){cx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?q.s*.4:q.s;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fill()}else cx.fillRect(-q.s/2,-q.s/3,q.s,q.s*.66);cx.restore()})});cx.globalAlpha=1}

function camT(sc,L){const [s,fx,fy]=kf(L,sc.cam);return {s,tx:540-fx*s,ty:960-fy*s}}
function sceneIdx(T){let i=0;for(;i<SC.length-1&&T>=SC[i+1].t0;i++);return i}
function svgOf(sc,L){return `<svg width="1080" height="1920" viewBox="0 0 1080 1920">${sc.draw(L)}</svg>`}
function render(T){
 const i=sceneIdx(T),sc=SC[i],L=T-sc.t0,D=.38;const A=$('LA'),B=$('LB');
 B.innerHTML=svgOf(sc,L);let c=camT(sc,L);let bT=`translate(${c.tx}px,${c.ty}px) scale(${c.s})`;B.style.clipPath='none';B.style.opacity=1;
 const inTr=i>0&&L<D&&['wipe','circle','zoom','slide','wipeup'].includes(sc.tr);$('edge').style.display='none';
 if(inTr){const pv=SC[i-1],pl=T-pv.t0;A.style.display='block';A.innerHTML=svgOf(pv,pl);const pc=camT(pv,pl);let aT=`translate(${pc.tx}px,${pc.ty}px) scale(${pc.s})`;A.style.opacity=1;const e=eio(L/D);
  if(sc.tr=='circle'){B.style.clipPath=`circle(${e*1250}px at ${sc.cx}px ${sc.cy}px)`}
  else if(sc.tr=='wipe'){B.style.clipPath=`inset(0 0 0 ${(1-e)*100}%)`;const ed=$('edge');ed.style.display='block';ed.style.left=((1-e)*1080-30)+'px'}
  else if(sc.tr=='wipeup'){B.style.clipPath=`inset(${(1-e)*100}% 0 0 0)`}
  else if(sc.tr=='slide'){bT=`translateX(${(1-e)*1080}px) `+bT;aT=`translateX(${-e*540}px) `+aT}
  else if(sc.tr=='zoom'){aT=`translate(540px,960px) scale(${1+e*1.6}) translate(-540px,-960px) `+aT;A.style.opacity=1-e;bT=`translate(540px,960px) scale(${.75+.25*e}) translate(-540px,-960px) `+bT;B.style.opacity=clamp(e*1.6)}
  A.style.transform=aT}else{A.style.display='none';A.innerHTML=''}
 B.style.transform=bT;
 $('flash').style.opacity=sc.tr=='flash'&&L<.32?.85*(1-L/.32):0;
 let sh=0,sx=0,sy=0;SHAKES.forEach(([t,a])=>{const d=T-t;if(d>=0&&d<.45){const k=a*Math.exp(-d*8);sx+=Math.sin(d*70)*k;sy+=Math.cos(d*55)*k}});$('stage').style.transform=`translate(${sx}px,${sy}px)`;
 drawCv(T,i==12||i==13);renderKT(T);renderSubs(T);renderBar(T);renderChip(T,i,L);
 $('vig').style.opacity=1;
}
async function init(data){W=data.words;VOICE=data.voice_dur;DUR=data.dur;buildKT();buildGroups();buildBar();await document.fonts.ready;render(0);
 return {n:W.length,groups:GROUPS.length,DUR,cuts:SC.map(s=>s.t0)}}
