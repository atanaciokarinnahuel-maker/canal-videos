<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B2545}
body{font-family:'Poppins',sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#13315C 0%,#0B2545 60%,#071a33 100%)}
#grid{position:absolute;left:-200px;top:-200px;width:1480px;height:2320px;
 background-image:linear-gradient(rgba(91,192,235,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(91,192,235,.10) 2px,transparent 2px),
 linear-gradient(rgba(91,192,235,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(91,192,235,.05) 1px,transparent 1px);
 background-size:120px 120px,120px 120px,24px 24px,24px 24px}
#marks{position:absolute;inset:0}
.mark{position:absolute;color:rgba(91,192,235,.35);font-weight:300;font-size:40px}
#progress{position:absolute;left:60px;right:60px;top:122px;height:12px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
#progress div{height:100%;width:0;background:linear-gradient(90deg,#FFC857,#FF8C61);border-radius:6px}
.scene{position:absolute;inset:0;opacity:0;will-change:transform}
.cam{position:absolute;inset:0;transform-origin:540px 760px}
.title{position:absolute;left:70px;right:70px;top:190px;text-align:center;font-weight:800;font-size:76px;line-height:1.08;letter-spacing:-1px;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.title .w{display:inline-block;margin:0 10px}
.amber{color:#FFC857}.cyan{color:#5BC0EB}.coral{color:#FF6B6B}.mint{color:#7BE0AD}
.card{position:absolute;left:90px;right:90px;padding:30px 40px;border-radius:30px;background:rgba(255,255,255,.96);color:#0B2545;box-shadow:0 18px 0 rgba(0,0,0,.25)}
.card .ref{font-weight:800;font-size:40px;color:#E8A317}
.card .ref small{font-weight:600;font-size:28px;color:#5d6f86;margin-left:10px}
.card .txt{font-weight:600;font-size:40px;line-height:1.25;margin-top:8px}
.chip{position:absolute;left:50%;padding:12px 30px;border-radius:40px;font-weight:800;font-size:32px;letter-spacing:2px;white-space:nowrap}
.chip.p{background:#5BC0EB;color:#0B2545}.chip.c{background:#7BE0AD;color:#0B2545}
.keyhead{position:absolute;left:0;right:0;top:185px;display:flex;justify-content:center;align-items:center;gap:26px}
.keynum{width:130px;height:130px;border-radius:50%;background:#FFC857;color:#0B2545;font-weight:900;font-size:86px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 #c98f12}
.keytxt{font-weight:800;font-size:68px;letter-spacing:-1px}
svg{position:absolute;overflow:visible}
#subs{position:absolute;left:60px;right:60px;top:1330px;height:220px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px 24px}
#subs .sw{font-weight:800;font-size:66px;color:#fff;display:inline-block;-webkit-text-stroke:3px #071a33;paint-order:stroke fill;text-shadow:0 7px 0 rgba(0,0,0,.45)}
#subs .sw.on{color:#FFC857}
#wipe{position:absolute;top:-300px;width:900px;height:2600px;background:#FFC857;transform:rotate(14deg);left:-1400px}
#wipe2{position:absolute;top:-300px;width:260px;height:2600px;background:#5BC0EB;transform:rotate(14deg);left:-1400px}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<div id="stage">
 <div id="grid"></div>
 <div id="marks"></div>
 <div id="scenes"></div>
 <div id="subs"></div>
 <div id="wipe2"></div><div id="wipe"></div>
 <div id="flash"></div>
 <div id="progress"><div></div></div>

<script>
// ---------- utilidades ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const elastic=t=>{t=clamp(t);if(t===0||t===1)return t;return Math.pow(2,-10*t)*Math.sin((t*10-.75)*2*Math.PI/3)+1};
const $=id=>document.getElementById(id);
let W=null, DUR=0, VOICE=0, M={}, SC=[];

function norm(s){return s.toLowerCase().replace(/[¿?¡!.,:;]/g,'')}
function findWord(word,after=0,nth=1){let c=0;for(let i=0;i<W.length;i++){if(W[i].start<after)continue;if(norm(W[i].text)===word){c++;if(c===nth)return W[i].start}}return null}

// ---------- SVG helpers ----------

 <circle cx="0" cy="-150" r="46" fill="#F2C9A0"/><path d="M-46,-160 q46,-60 92,0 q-10,-30 -46,-34 q-36,4 -46,34z" fill="#3b2a20"/>
 <circle cx="-15" cy="-150" r="5" fill="#0B2545"/><circle cx="15" cy="-150" r="5" fill="#0B2545"/>
 <path d="M-14,-130 q14,12 28,0" stroke="#0B2545" stroke-width="4" fill="none" stroke-linecap="round"/>
 <rect x="-52" y="-100" width="104" height="120" rx="40" fill="${col}"/></g>`}
function sheep(id){return `<g id="${id}"><ellipse cx="0" cy="0" rx="70" ry="48" fill="#fff"/>
 <circle cx="-40" cy="-25" r="30" fill="#fff"/><circle cx="0" cy="-38" r="32" fill="#fff"/><circle cx="40" cy="-25" r="30" fill="#fff"/>

function ant(id){return `<g id="${id}"><g class="legs" stroke="#2b1a10" stroke-width="7" stroke-linecap="round">
 <line class="l1" x1="-20" y1="10" x2="-38" y2="44"/><line class="l2" x1="0" y1="12" x2="0" y2="46"/><line class="l3" x1="20" y1="10" x2="38" y2="44"/></g>

 <g class="grain"><ellipse cx="6" cy="-42" rx="30" ry="16" fill="#FFC857" transform="rotate(-15 6 -42)"/></g></g>`}

 for(let i=0;i<22;i++){const m=$('mk'+i);const x=((i*197+T*(10+i%5*6))%1180)-50;const y=((i*331+T*(18+i%4*7))%2000)-40;m.style.left=x+'px';m.style.top=(1920-y)+'px';m.style.transform=`rotate(${T*20+i*40}deg)`}
 $('progress').firstElementChild.style.width=(clamp(T/DUR)*100)+'%';
 // escena activa
 let idx=0;for(let i=0;i<SC.length;i++)if(T>=SC[i])idx=i;
 const TD=0.4;
 for(let i=0;i<SC.length;i++){const el=$('s'+i);el.style.opacity=0;el.style.clipPath='none';el.style.transform='none';el.style.zIndex=1}
 const show=(i)=>{const st=SC[i];const en=i+1<SC.length?SC[i+1]:DUR;const lt=T-st;const el=$('s'+i);el.style.opacity=1;R[i](lt,en-st,T);return el};
 const cur=show(idx);
 // transición de entrada en [SC[idx], SC[idx]+TD]
 const tin=T-SC[idx];
 const wipe=$('wipe'),wipe2=$('wipe2');wipe.style.left='-1400px';wipe2.style.left='-1400px';$('flash').style.opacity=0;
 if(idx>0&&tin<TD){const p=tin/TD;const prev=show(idx-1);prev.style.zIndex=0;cur.style.zIndex=2;const type=TRANS[idx-1];
  if(type==='zoom'){prev.style.transform=`scale(${1+p*0.5})`;prev.style.opacity=1-p;cur.style.transform=`scale(${lerp(0.7,1,eo(p))})`;cur.style.opacity=eo(p)}
  else if(type==='circle'){cur.style.clipPath=`circle(${eo(p)*120}% at 50% 45%)`}
  else if(type==='slide'){prev.style.transform=`translateX(${-eio(p)*1080}px)`;cur.style.transform=`translateX(${(1-eio(p))*1080}px)`}
  else if(type==='wipe'){cur.style.clipPath=`inset(0 0 0 ${(1-eio(p))*100}%)`}
 }
 // barrido de color cerca de cortes tipo wipe
 for(let i=1;i<SC.length;i++){const type=TRANS[i-1];const a=(T-SC[i]+0.15)/0.6;if(a>0&&a<1&&(type==='wipe')){wipe.style.left=lerp(1300,-2200,eio(a))+'px';wipe2.style.left=lerp(1500,-1900,eio(a))+'px'}
  if(type==='zoom'&&T>=SC[i]&&T<SC[i]+0.12){$('flash').style.opacity=0.35*(1-(T-SC[i])/0.12)}}
 renderSubs(T);
}
