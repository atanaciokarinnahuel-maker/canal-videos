#flash{position:absolute;inset:0;background:#fffbe8;opacity:0}
#edge{position:absolute;top:0;width:60px;height:1920px;background:linear-gradient(90deg,rgba(247,179,43,0),#fff3c4,rgba(247,179,43,0));display:none}

<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const elastic=t=>{t=clamp(t);if(t===0||t===1)return t;return Math.pow(2,-9*t)*Math.sin((t*9-.75)*2*Math.PI/3)+1};
const $=id=>document.getElementById(id);
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const P=(L,a,d)=>clamp((L-a)/d);
function kf(T,a,ease=eio){if(T<=a[0][0])return a[0].slice(1);for(let i=1;i<a.length;i++){if(T<=a[i][0]){const d=a[i][0]-a[i-1][0];const u=d<=0?1:ease((T-a[i-1][0])/d);return a[i].slice(1).map((v,k)=>lerp(a[i-1][k+1],v,u))}}return a[a.length-1].slice(1)}
function hex(c){return [1,3,5].map(i=>parseInt(c.substr(i,2),16))}
function shade(c,f){const A=hex(c);return '#'+A.map(v=>Math.round(clamp(f<0?v*(1+f):v+(255-v)*f,0,255)).toString(16).padStart(2,'0')).join('')}
const INK='#231a4f',GOLD='#f7b32b',CORAL='#ff6f59',AQUA='#3fc1c9',SAGE='#8cb369';
let W=[],VOICE=0,DUR=0,GROUPS=[];
const F=`font-family="Inter Display" font-weight="900"`;
const TX=(x,y,t,fs,col='#fff',st=INK,sw=10,anc='middle')=>`<text x="${x}" y="${y}" text-anchor="${anc}" ${F} font-size="${fs}" fill="${col}" stroke="${st}" stroke-width="${sw}" paint-order="stroke fill">${t}</text>`;
/* ===================== piezas ===================== */
const sky=id=>`<rect x="-300" y="-300" width="1680" height="2520" fill="url(#${id})"/>`;
function sun(x,y,r,op=1){return `<circle cx="${x}" cy="${y}" r="${r*3.2}" fill="url(#gSun)" opacity="${.75*op}"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff4d0" opacity="${op}"/>`}
function rays(x,y,n,len,rot,op,col='#fff8dc',wd=.07){let s='';for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;s+=`<path d="M${x} ${y} L${x+Math.cos(a-wd)*len} ${y+Math.sin(a-wd)*len} L${x+Math.cos(a+wd)*len} ${y+Math.sin(a+wd)*len}Z"/>`}return `<g fill="${col}" opacity="${op}">${s}</g>`}
function mtn(yb,amp,col,seed,dx,extra=''){let d=`M-300 2300 L-300 ${yb}`;for(let x=-300;x<=1400;x+=40){const y=yb-amp*(.55+.3*Math.sin((x+dx)*.0062+seed)+.18*Math.sin((x+dx)*.017+seed*2.1));d+=` L${x} ${y.toFixed(1)}`}d+=` L1400 2300Z`;return `<path d="${d}" fill="${col}" ${extra}/>`}
function mesa(x,yb,w,h,col){return `<path d="M${x-w/2-60} ${yb} L${x-w/2} ${yb-h} L${x+w/2} ${yb-h} L${x+w/2+60} ${yb}Z" fill="${col}"/><path d="M${x-w/2} ${yb-h} L${x+w/2} ${yb-h} L${x+w/2-10} ${yb-h+18} L${x-w/2+10} ${yb-h+18}Z" fill="${shade(col,.18)}"/>`}
function cloud(x,y,s,col='#fff',op=.85){return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}" fill="${col}"><circle cx="-60" cy="0" r="46"/><circle cx="0" cy="-26" r="62"/><circle cx="62" cy="-4" r="44"/><circle cx="110" cy="12" r="30"/><rect x="-106" y="0" width="246" height="44" rx="22"/></g>`}
function clouds(L,set,spd=14){return set.map(([x,y,s,c,o],i)=>cloud(((x+L*spd*(1+i%3*.4))%1500+1500)%1500-250,y,s,c,o)).join('')}
function birds(L,x0,y0,n=4){let s='';for(let i=0;i<n;i++){const x=x0+L*70+i*46,y=y0+Math.sin(i*2)*22+Math.sin(L*3+i)*6,f=Math.sin(L*14+i*1.7)*10;s+=`<path d="M${x-16} ${y-f} Q${x-8} ${y-4} ${x} ${y} Q${x+8} ${y-4} ${x+16} ${y-f}" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/>`}return s}
function stars(L,n=60,seed=5){let s='';for(let i=0;i<n;i++){const x=R(seed+i)*1080,y=R(seed+i*3.3)*1050,r=1.5+R(seed+i*7)*3.5,tw=.35+.65*Math.abs(Math.sin(L*2.2+i));s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff6d5" opacity="${tw}"/>`}return s}
function ground(y,col='url(#gSand)',amp=18,seed=1,dx=0){let d=`M-300 2300 L-300 ${y}`;for(let x=-300;x<=1400;x+=60){d+=` L${x} ${(y-amp*Math.sin((x+dx)*.008+seed)).toFixed(1)}`}return `<path d="${d} L1400 2300Z" fill="${col}"/>`}
function palm(x,yb,s,L,ph=0){const sw=Math.sin(L*1.6+ph)*4;let f='';for(let i=0;i<7;i++){const a=-160+i*24+sw*1.5;f+=`<g transform="rotate(${a})"><path d="M0 0 Q70 -36 150 -6 Q70 -12 0 0Z" fill="${i%2?'#2e8b57':'#3aa36a'}"/></g>`}
 return `<g transform="translate(${x},${yb}) scale(${s})"><path d="M-10 0 Q-4 -150 ${18+sw} -300 L${34+sw} -300 Q12 -150 12 0Z" fill="#a0673a"/>${[0,1,2,3,4,5].map(i=>`<path d="M${-8+i*3} ${-30-i*46} L${14+i*3.4+sw*i/6} ${-38-i*46}" stroke="#7a4a26" stroke-width="5"/>`).join('')}<g transform="translate(${26+sw},-300)">${f}<circle r="12" fill="#7a4a26"/></g></g>`}
function houses(yb,dx,s=1,seed=1,col='#f2d3a6'){let o='';for(let i=0;i<9;i++){const w=(90+R(seed+i)*80)*s,h=(80+R(seed+i*2)*140)*s,x=-200+i*170*s+dx;const c=shade(col,(R(seed+i*5)-.5)*.2);
 o+=`<rect x="${x}" y="${yb-h}" width="${w}" height="${h}" fill="${c}"/><rect x="${x-6}" y="${yb-h-10}" width="${w+12}" height="14" rx="4" fill="${shade(c,-.15)}"/><rect x="${x+w*.3}" y="${yb-h*.6}" width="${18*s}" height="${26*s}" rx="${8*s}" fill="${INK}" opacity=".55"/>`;
 if(R(seed+i*9)>.7)o+=`<path d="M${x+w*.15} ${yb-h-8} A${w*.35} ${w*.35} 0 0 1 ${x+w*.85} ${yb-h-8}Z" fill="${AQUA}"/>`}
 return o+`<rect x="-300" y="${yb-1}" width="1700" height="400" fill="${shade(col,-.1)}"/>`}
const ITEM={
 bag:`<g transform="translate(0,-10)"><path d="M-30 -40 Q-48 20 -26 40 L26 40 Q48 20 30 -40Z" fill="#c98a4a" stroke="#7a4a26" stroke-width="5"/><path d="M-22 -44 L22 -44 L14 -32 L-14 -32Z" fill="#a06a36"/><rect x="-18" y="-40" width="36" height="9" rx="4" fill="${GOLD}"/><circle cx="0" cy="8" r="14" fill="url(#gCoin)" stroke="#b07a10" stroke-width="3"/></g>`,

 quill:`<path d="M0 0 L-6 -20 Q-30 -90 -10 -130 Q4 -80 6 -20Z" fill="#fff" stroke="${INK}" stroke-width="3"/><path d="M0 0 L-4 -22" stroke="${INK}" stroke-width="3"/>`,
 lamp:`<circle cy="-30" r="70" fill="url(#gFire)" opacity=".8"/><path d="M-34 0 Q0 18 34 0 Q30 -14 0 -14 Q-30 -14 -34 0Z" fill="#c98a4a" stroke="#7a4a26" stroke-width="4"/><path d="M28 -8 L46 -18" stroke="#7a4a26" stroke-width="7" stroke-linecap="round"/><path d="M46 -22 Q56 -44 48 -58 Q40 -44 46 -22Z" fill="#ffb347"/>`,
 basket:`<path d="M-56 -40 L56 -40 L44 30 L-44 30Z" fill="#c98a4a" stroke="#7a4a26" stroke-width="5"/><path d="M-50 -14 L50 -14 M-46 10 L46 10" stroke="#a06a36" stroke-width="5"/><circle cx="-24" cy="-48" r="18" fill="#ff8f6b"/><circle cx="8" cy="-52" r="20" fill="#9ccf6a"/><circle cx="34" cy="-46" r="16" fill="#ffd36b"/>`
};
function person(o){
